name: checks

# Reusable validation suite (lint, test, security, helm) called by both ci.yml
# (PRs / feature branches) and release.yml (main / tags, gating publish).
#
# Actions are pinned to commit SHAs (Dependabot keeps them current) so a
# retagged action can't run unreviewed code in CI.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: pip install ruff==0.15.20
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      # Coverage gate: the suite sits at ~92%; fail if it regresses below 90%.
      - run: pytest -q --cov=app --cov-report=term-missing --cov-fail-under=90

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.21.2
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0 # gitleaks scans git history
      # Run the gitleaks CLI directly (the marketplace action requires a paid
      # license for organization repos); fails on any leak found in history.
      - name: Secret scan (gitleaks)
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks detect --source . --redact --exit-code 1 --verbose
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      # Audit the runtime deps that ship in the image for known CVEs.
      - run: pip install . pip-audit
      - run: pip-audit

  helm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KUBECONFORM_VERSION: v0.6.7
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
      - run: helm lint charts/serverless-api
      # Render with defaults and validate the manifests against the Kubernetes
      # schemas; CRDs (Knative, DomainMapping, cert-manager, ESO) are skipped.
      - name: kubeconform
        run: |
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C /usr/local/bin kubeconform
          helm template serverless-api charts/serverless-api \
            | kubeconform -strict -summary -ignore-missing-schemas

  # Verify the Containerfile builds and scan the image on every run; this gates
  # publishing (release.yml's push job `needs` this suite), so the pushed image
  # is the scanned one. No push here.
  image-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build (load, no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./Containerfile
          load: true
          tags: serverless-api:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Print HIGH + CRITICAL for visibility, but do not fail on them: base-image
      # HIGH advisories are published continuously, so a HIGH gate means red CI
      # even when nothing in our code changed. The Containerfile applies the
      # available OS/pip patches (dnf update) to keep HIGH low regardless.
      - name: Vulnerability report (Trivy)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: serverless-api:scan
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
      # Gate: fail the build only on CRITICAL vulnerabilities.
      - name: Vulnerability gate (Trivy, CRITICAL)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: serverless-api:scan
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
