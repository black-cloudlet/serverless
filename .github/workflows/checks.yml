name: checks

# Reusable validation suite (lint, test, security, helm) called by both ci.yml
# (PRs / feature branches) and release.yml (main / tags, gating publish).
on:
  workflow_call:

permissions:
  contents: read

jobs:
  # Single source of truth for the Python version: it lives only in the Dockerfile
  # base image and pyproject `requires-python` (ruff derives its target from the
  # latter). This job fails the build if those two drift - e.g. a Dependabot
  # base-image bump that pyproject didn't follow - and exports the version so the
  # setup-python jobs below never hardcode it.
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      python: ${{ steps.derive.outputs.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: derive
        run: |
          req_py=$(grep -oP 'requires-python = ">=\K[0-9]+\.[0-9]+' pyproject.toml)
          for df in Dockerfile Dockerfile.controller Dockerfile.provisioner; do
            docker_py=$(grep -oP 'FROM python:\K[0-9]+\.[0-9]+' "$df")
            if [ -z "$docker_py" ] || [ "$docker_py" != "$req_py" ]; then
              echo "::error::Python version drift: $df=$docker_py, requires-python=$req_py. Bump them together."
              exit 1
            fi
          done
          echo "python=$docker_py" >> "$GITHUB_OUTPUT"
          echo "Python version (Dockerfile == requires-python): $docker_py"

  lint:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ needs.version.outputs.python }}
      # Derived from pyproject, not pinned again here: a second copy of the
      # version is a second thing to forget, and a formatter that gates the PR
      # while disagreeing with the one `pip install -e ".[dev]"` gives a
      # contributor is worse than either version alone. Same single-source rule
      # the `version` job above applies to Python.
      - run: pip install "$(grep -oP 'ruff==[0-9.]+' pyproject.toml)"
      - run: ruff check .
      - run: ruff format --check .

  test:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ needs.version.outputs.python }}
          cache: pip
      - run: pip install -e ".[api,dev]"
      - run: pytest -q --cov=api --cov=common --cov=controller --cov=provisioner --cov-report=term-missing --cov-fail-under=90

  security:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.21.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans git history
      # Run the gitleaks CLI directly; fails on any leak found in history.
      - name: Secret scan (gitleaks)
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks detect --source . --redact --exit-code 1 --verbose
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ needs.version.outputs.python }}
      # Audit the runtime deps that ship in the image for known CVEs.
      - run: pip install ".[api]" pip-audit
      - run: pip-audit

  helm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KUBECONFORM_VERSION: v0.6.7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: actions/setup-python@e9d6f990972a57673cdb72ec29e19d42ba28880f # v6.0.0
        with:
          python-version: "3.14"
      # For dev/tenant_templates.py, which loads the chart's tenant template set
      # through the provisioner's own loader below.
      - run: pip install .
      - run: helm lint charts/serverless-api
      - run: helm lint charts/serverless-api -f charts/serverless-api/ci/everything-values.yaml
      # Render with defaults and validate the manifests. Core Kubernetes kinds
      # use the built-in schemas; CRDs (Knative Service/DomainMapping,
      # cert-manager, ESO) are validated against the community CRDs-catalog, with
      # -ignore-missing-schemas as a fallback for anything not catalogued (e.g.
      # OpenShift Route).
      - name: kubeconform
        run: |
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C /usr/local/bin kubeconform
          for values in "" "-f charts/serverless-api/ci/everything-values.yaml"; do
            helm template serverless-api charts/serverless-api $values \
              | kubeconform -strict -summary -ignore-missing-schemas \
                  -schema-location default \
                  -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          done
      # The chart WRITES the tenant template set and the provisioner READS it.
      # Until the two meet, a malformed NetworkPolicy or a mistyped placeholder
      # is found by the first tenant onboarding. Loading applies every rule the
      # running provisioner applies; validating the RENDERED objects is what
      # catches a policy that is only wrong once a namespace is substituted in.
      - name: The tenant template set loads and renders into valid objects
        run: |
          for values in "" "-f charts/serverless-api/ci/everything-values.yaml"; do
            helm template serverless-api charts/serverless-api $values > /tmp/rendered.yaml
            python dev/tenant_templates.py /tmp/rendered.yaml \
              | kubeconform -strict -summary -ignore-missing-schemas \
                  -schema-location default \
                  -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          done
      # The set must be byte-identical in every region. The ensure fan-out
      # converges a peer's namespace from whichever provisioner took the
      # request, so a per-region value baked in here - a Vault path, a registry
      # host - would make that write wrong rather than merely redundant
      # (provisioner/ensure.py). Region-varying values go in as placeholders the
      # provisioner resolves against the cluster it is writing to.
      - name: The tenant template set is region-neutral
        run: |
          for region in central south; do
            helm template serverless-api charts/serverless-api --set global.region=$region \
              | python dev/tenant_templates.py --digest - > "/tmp/digest-$region"
          done
          if ! diff -q /tmp/digest-central /tmp/digest-south; then
            echo "::error::the tenant template set differs between regions:"
            paste /tmp/digest-central /tmp/digest-south
            exit 1
          fi
          echo "both regions render set $(cat /tmp/digest-central)"

  # Verify the Dockerfile builds and scan the image on every run; this gates
  # publishing (release.yml's push job `needs` this suite), so the pushed image
  # is the scanned one. No push here.
  image-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build the API image (load, no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: serverless-api:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build the build-controller image (load, no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile.controller
          load: true
          tags: serverless-build-controller:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build the provisioner image (load, no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile.provisioner
          load: true
          tags: serverless-provisioner:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Each image must actually start its own service. Nothing else in the
      # suite would notice a package left out of a COPY or a module path that
      # stopped resolving - the failure would arrive as a CrashLoopBackOff
      # after deploy.
      - name: Each image runs its own service
        run: |
          docker run --rm --entrypoint python serverless-api:scan \
            -c "import api.main as m; assert m.app"
          docker run --rm --entrypoint python serverless-build-controller:scan \
            -c "import controller.main as m; assert callable(m.run)"
          docker run --rm --entrypoint python serverless-provisioner:scan \
            -c "import provisioner.main as m; assert callable(m.run)"
          docker run --rm --entrypoint python serverless-provisioner:scan \
            -c "from provisioner.api import create_app; from provisioner.config import ProvisionerSettings; assert create_app([], ProvisionerSettings())"
      # The controller serves nothing, so it must carry no web stack at all. An
      # import in `common` that quietly pulled fastapi back in would pass every
      # other check (docs/BUILDING.md - Two images).
      - name: The controller image carries no web stack
        run: |
          docker run --rm --entrypoint python serverless-build-controller:scan -c "
          import importlib.util, sys
          leaked = [m for m in ('fastapi', 'starlette', 'uvicorn', 'jwt', 'cryptography')
                    if importlib.util.find_spec(m) is not None]
          if leaked:
              sys.exit(f'this image should not ship {leaked}')
          "
      # The provisioner does serve HTTP - one internal endpoint - so a web
      # server is expected. What it must never carry is the auth stack: its
      # caller presents a shared token, and reaching cloudlet_apis.auth for the
      # comparison would put pyjwt and cryptography in this image.
      - name: The provisioner image carries no auth stack
        run: |
          docker run --rm --entrypoint python serverless-provisioner:scan -c "
          import importlib.util, sys
          leaked = [m for m in ('jwt', 'cryptography')
                    if importlib.util.find_spec(m) is not None]
          if leaked:
              sys.exit(f'this image should not ship {leaked}')
          "
      # Print HIGH + CRITICAL for visibility, but do not fail on them: base-image
      # HIGH advisories are published continuously, so a HIGH gate means red CI
      # even when nothing in our code changed. The python:3.14-slim base is
      # rebuilt on Debian security updates, keeping HIGH low without a patch step.
      - name: Vulnerability report (Trivy, API)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: serverless-api:scan
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
      # Gate: fail the build only on CRITICAL vulnerabilities, in any image.
      - name: Vulnerability gate (Trivy, CRITICAL, API)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: serverless-api:scan
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Vulnerability gate (Trivy, CRITICAL, build controller)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: serverless-build-controller:scan
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Vulnerability gate (Trivy, CRITICAL, provisioner)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: serverless-provisioner:scan
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
