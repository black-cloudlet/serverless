name: checks

# Reusable validation suite (lint, test, security, helm) called by both ci.yml
# (PRs / feature branches) and release.yml (main / tags, gating publish).
on:
  workflow_call:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff==0.15.20
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q --cov=api --cov=common --cov-report=term-missing --cov-fail-under=90

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.21.2
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # gitleaks scans git history
      # Run the gitleaks CLI directly; fails on any leak found in history.
      - name: Secret scan (gitleaks)
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks detect --source . --redact --exit-code 1 --verbose
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # Audit the runtime deps that ship in the image for known CVEs.
      - run: pip install . pip-audit
      - run: pip-audit

  helm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KUBECONFORM_VERSION: v0.6.7
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - run: helm lint charts/serverless-api
      # Render with defaults and validate the manifests. Core Kubernetes kinds
      # use the built-in schemas; CRDs (Knative Service/DomainMapping,
      # cert-manager, ESO) are validated against the community CRDs-catalog, with
      # -ignore-missing-schemas as a fallback for anything not catalogued (e.g.
      # OpenShift Route).
      - name: kubeconform
        run: |
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C /usr/local/bin kubeconform
          helm template serverless-api charts/serverless-api \
            | kubeconform -strict -summary -ignore-missing-schemas \
                -schema-location default \
                -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'

  # Verify the Dockerfile builds and scan the image on every run; this gates
  # publishing (release.yml's push job `needs` this suite), so the pushed image
  # is the scanned one. No push here.
  image-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build (load, no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: serverless-api:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Print HIGH + CRITICAL for visibility, but do not fail on them: base-image
      # HIGH advisories are published continuously, so a HIGH gate means red CI
      # even when nothing in our code changed. The python:3.13-slim base is
      # rebuilt on Debian security updates, keeping HIGH low without a patch step.
      - name: Vulnerability report (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: serverless-api:scan
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
      # Gate: fail the build only on CRITICAL vulnerabilities.
      - name: Vulnerability gate (Trivy, CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: serverless-api:scan
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
