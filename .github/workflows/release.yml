name: Release

# One-click release (manual). Enter a version - X.Y.Z or a pre-release
# X.Y.Z-{alpha|beta|rc}.N (e.g. 1.2.0-beta.1) - and this workflow:
#   1. validates the version string and that no such tag exists yet;
#   2. runs the full check suite;
#   3. bumps the version in pyproject.toml + Chart.yaml and commits it onto the
#      vX.Y.Z tag ONLY - the branch it runs from is left unchanged;
#   4. builds/scans/signs and publishes the image and chart from the tag, then
#      cuts a GitHub Release. A pre-release does NOT move the :latest image tag
#      and is marked as a GitHub pre-release.
#
# The checks run BEFORE the tag is pushed, deliberately: the tag is the one
# thing here that a re-run cannot redo, and step 1 refuses a version that
# already has one.
#
# The tag/image/chart use the SemVer string (1.2.0-beta.1); the installed Python
# version normalizes to PEP 440 (1.2.0b1), so __version__ reports 1.2.0b1.
#
# Self-contained on purpose: a tag pushed by GITHUB_TOKEN does NOT re-trigger a
# tag-listening workflow, so we do the whole release in this one run - no PAT.
# The stamped version lives only on the tag (the release snapshot); the branch
# stays at its development baseline.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 1.2.0 or 1.2.0-beta.1 (no leading v)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Reject a malformed or already-used version before anything runs. Separate
  # from `prepare` so the whole check suite does not have to run to find out the
  # version string was a typo.
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate the version
        run: |
          VERSION="${{ inputs.version }}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
            echo "::error::version must be X.Y.Z or X.Y.Z-{alpha|beta|rc}.N (e.g. 1.2.0-beta.1), no leading v"; exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "::error::tag v$VERSION already exists"; exit 1
          fi
          echo "Releasing v$VERSION"

  # Same validation as CI, and it runs BEFORE the tag is pushed. The tag is the
  # one artifact of this workflow that cannot be undone by re-running it: the
  # version guard above refuses a version that already has one, so a tag pushed
  # ahead of a failing check would block retrying that same version until
  # someone deleted it by hand. Nothing here depends on the stamped version, so
  # gating on it costs nothing.
  checks:
    needs: validate
    uses: ./.github/workflows/checks.yml

  prepare:
    needs: [validate, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # commit the version bump + push the tag
    outputs:
      version: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Bump, commit, tag
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          sed -i -E "s/^version = \".*\"/version = \"$VERSION\"/" pyproject.toml
          sed -i -E "s/^version:.*/version: $VERSION/" charts/serverless-api/Chart.yaml
          sed -i -E "s/^appVersion:.*/appVersion: \"$VERSION\"/" charts/serverless-api/Chart.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "release: v$VERSION"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          # Push ONLY the tag; the branch this ran from is left untouched. The
          # bump commit exists solely on the tag (the release snapshot).
          git push origin "v$VERSION"

  # One job per service image (docs/BUILDING.md - Two images). Both are built
  # from the same tag, so they cannot disagree about the library they share.
  # `prepare` already gates on `checks`, so publishing is still gated on it.
  image:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: ./Dockerfile
          - name: build-controller
            dockerfile: ./Dockerfile.controller
          - name: provisioner
            dockerfile: ./Dockerfile.provisioner
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "v${{ needs.prepare.outputs.version }}" # build the tagged code
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            # :latest only for stable releases; a pre-release (contains '-') must not move it.
            type=raw,value=latest,enable=${{ !contains(needs.prepare.outputs.version, '-') }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The checks suite (a `needs`) already built + Trivy-scanned this context;
      # the gha cache makes this a fast rebuild. Attaches an SBOM + provenance.
      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless signature (OIDC -> Fulcio/Rekor). GHCR names must be lowercase.
      - name: Sign image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.name }}"
          cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"

  chart:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "v${{ needs.prepare.outputs.version }}" # Chart.yaml already stamped by prepare
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Package
        run: helm package charts/serverless-api --destination dist

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # cosign authenticates via the Docker credential store, not helm's - without
      # this it hits ghcr.io anonymously and fails to sign (private package -> 401).
      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push + sign
        # `pipefail` because the push is piped into `tee`: without it the
        # pipeline reports tee's exit status, so a failed push would fall
        # through to an empty digest and fail later, in cosign, as something
        # else. `-u` catches the same emptiness if the log ever stops carrying
        # a digest.
        shell: bash
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
          helm push dist/serverless-api-*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts 2>&1 | tee push.log
          DIGEST=$(grep -oE 'sha256:[0-9a-f]+' push.log | head -1)
          if [ -z "${DIGEST}" ]; then
            echo "::error::helm push reported no digest; refusing to sign"; exit 1
          fi
          cosign sign --yes "ghcr.io/${{ github.repository_owner }}/charts/serverless-api@${DIGEST}"

  github-release:
    needs: [prepare, image, chart]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          REPO_LC="${GITHUB_REPOSITORY,,}"
          cat > notes.md <<EOF
          ## Artifacts

          - **API image:** \`ghcr.io/${REPO_LC}/api:${VERSION}\`
          - **Build controller image:** \`ghcr.io/${REPO_LC}/build-controller:${VERSION}\`
          - **Provisioner image:** \`ghcr.io/${REPO_LC}/provisioner:${VERSION}\`
          - **Chart:** \`oci://ghcr.io/${{ github.repository_owner }}/charts/serverless-api:${VERSION}\`

          All are cosign-signed (keyless) and carry an SBOM.
          EOF
          prerelease=""
          [[ "$VERSION" == *-* ]] && prerelease="--prerelease"
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --notes-file notes.md \
            --generate-notes $prerelease
