name: CI

# Validation for PRs and feature branches. Pushes to main and version tags are
# handled by release.yml (which runs the same checks before publishing), so they
# are excluded here to avoid running the suite twice.
on:
  pull_request:
  push:
    branches-ignore: [main]
    paths-ignore: ["**.md"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
