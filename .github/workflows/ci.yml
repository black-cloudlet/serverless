name: CI

# Validation for PRs and branch pushes (including main). Publishing is done only
# by release.yml (manual workflow_dispatch), so nothing here pushes artifacts.
on:
  pull_request:
  push:
    branches: ["**"]
    paths-ignore: ["**.md"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
