name: CI/CD

# Lint, test and helm-lint on every push/PR; build the image everywhere to
# verify the Containerfile compiles, and push it to GHCR only on the default
# branch and version tags.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      # Repo isn't ruff-format clean yet, so gate on the linter only. Add
      # `ruff format --check .` here once the tree has been formatted.
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint charts/serverless-api
      # Render the chart with default values to verify every template produces
      # valid manifests (catches template/values errors `helm lint` misses).
      - run: helm template serverless-api charts/serverless-api --debug > /dev/null

  image:
    needs: [lint, test, helm-lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Push only from the default branch and version tags; PRs and feature
      # branches build for verification but don't publish.
      - name: Decide whether to push
        id: gate
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ] || [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        if: steps.gate.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            # main publishes :latest, matching the chart's "latest" appVersion.
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          push: ${{ steps.gate.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart:
    needs: [lint, test, helm-lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      # On a tagged release, stamp Chart.yaml version + appVersion to the tag
      # (e.g. v1.2.3 -> 1.2.3); on main/branches keep the 0.0.0 / "latest"
      # development baseline already committed in Chart.yaml.
      - name: Stamp chart version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            sed -i "s/^version:.*/version: ${VERSION}/" charts/serverless-api/Chart.yaml
            sed -i "s/^appVersion:.*/appVersion: \"${VERSION}\"/" charts/serverless-api/Chart.yaml
          fi
          grep -E '^(version|appVersion):' charts/serverless-api/Chart.yaml

      - name: Package
        run: helm package charts/serverless-api --destination dist

      # Publish only from the default branch and version tags, same gate as the
      # image; PRs and feature branches package for verification but don't push.
      - name: Push to GHCR
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
          helm push dist/serverless-api-*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
