name: CI/CD

# Lint, test, scan and helm-validate on every push/PR; build the image
# everywhere to verify the Containerfile compiles; publish the image + chart
# (scanned, signed, with SBOM) only on the default branch and version tags, and
# cut a GitHub Release on a version tag.
#
# Actions are pinned to commit SHAs (Dependabot keeps them current) so a
# retagged action can't run unreviewed code with our GHCR-write token.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths-ignore: ["**.md"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      # Pinned so lint is reproducible; matches the ruff pin in pyproject [dev].
      - run: pip install ruff==0.15.20
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      # Coverage gate: the suite sits at ~92%; fail if it regresses below 90%.
      - run: pytest -q --cov=app --cov-report=term-missing --cov-fail-under=90

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.21.2
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0 # gitleaks scans git history
      # Run the gitleaks CLI directly (the marketplace action requires a paid
      # license for organization repos); fails on any leak found in history.
      - name: Secret scan (gitleaks)
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks detect --source . --redact --exit-code 1 --verbose
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      # Audit exactly the pinned deps that ship in the image for known CVEs.
      # Split installs: requirements.txt is hash-pinned (all-or-nothing hash
      # mode), so pip-audit must be installed on its own.
      - run: pip install -r requirements.txt
      - run: pip install pip-audit
      - run: pip-audit

  helm-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KUBECONFORM_VERSION: v0.6.7
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
      - run: helm lint charts/serverless-api
      # Render with defaults and validate the manifests against the Kubernetes
      # schemas; CRDs (Knative, DomainMapping, cert-manager, ESO) are skipped.
      - name: kubeconform
        run: |
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C /usr/local/bin kubeconform
          helm template serverless-api charts/serverless-api \
            | kubeconform -strict -summary -ignore-missing-schemas
      # Unit-test chart templating logic (e.g. the image tag/appVersion default).
      - name: helm unittest
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest
          helm unittest charts/serverless-api

  image:
    needs: [lint, test, security, helm-lint]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Push only from the default branch and version tags; PRs and feature
      # branches build + scan for verification but don't publish.
      - name: Decide whether to push
        id: gate
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ] || [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            # main publishes :latest, matching the chart's "latest" appVersion.
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      # Build once into the local daemon so we can scan the exact image before
      # it is ever pushed.
      - name: Build for scan
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./Containerfile
          load: true
          tags: serverless-api:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Vulnerability scan (Trivy)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: serverless-api:scan
          format: table
          exit-code: "1" # fail the build on findings
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Log in to GHCR
        if: steps.gate.outputs.push == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Reuses the cached layers from the scan build; attaches an SBOM and
      # provenance attestation to the published image.
      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./Containerfile
          push: ${{ steps.gate.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        if: steps.gate.outputs.push == 'true'
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      # Keyless signature (OIDC -> Fulcio/Rekor); no long-lived keys to manage.
      # GHCR names must be lowercase (the repo name is mixed-case).
      - name: Sign image
        if: steps.gate.outputs.push == 'true'
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"

  chart:
    needs: [lint, test, security, helm-lint]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1

      # On a tagged release, stamp Chart.yaml version + appVersion to the tag
      # (e.g. v1.2.3 -> 1.2.3); on main/branches keep the 0.0.0 / "latest"
      # development baseline already committed in Chart.yaml.
      - name: Stamp chart version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            sed -i "s/^version:.*/version: ${VERSION}/" charts/serverless-api/Chart.yaml
            sed -i "s/^appVersion:.*/appVersion: \"${VERSION}\"/" charts/serverless-api/Chart.yaml
          fi
          grep -E '^(version|appVersion):' charts/serverless-api/Chart.yaml

      - name: Package
        run: helm package charts/serverless-api --destination dist

      - name: Install cosign
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      # Publish only from the default branch and version tags, same gate as the
      # image; PRs and feature branches package for verification but don't push.
      - name: Push + sign
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
          helm push dist/serverless-api-*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts 2>&1 | tee push.log
          DIGEST=$(grep -oE 'sha256:[0-9a-f]+' push.log | head -1)
          cosign sign --yes "ghcr.io/${{ github.repository_owner }}/charts/serverless-api@${DIGEST}"

  release:
    needs: [image, chart]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the GitHub Release
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          REPO_LC="${GITHUB_REPOSITORY,,}"
          cat > notes.md <<EOF
          ## Artifacts

          - **Image:** \`ghcr.io/${REPO_LC}:${VERSION}\`
          - **Chart:** \`oci://ghcr.io/${{ github.repository_owner }}/charts/serverless-api:${VERSION}\`

          Both are cosign-signed (keyless) and carry an SBOM.
          EOF
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            --generate-notes
