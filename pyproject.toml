[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "serverless-api"
version = "0.1.0"
description = "FaaS/CaaS REST API wrapping Knative on OpenShift"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.8",
    "kubernetes>=29.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

# PEP 8 enforcement. Run `ruff check .` to lint and `ruff format .` to format.
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# pycodestyle (E/W), pyflakes (F), isort (I) — PEP 8 plus import ordering.
select = ["E", "W", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Tests carry long literal assertions (hosts, encoded blobs); don't reflow them.
"tests/**" = ["E501"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
