[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "serverless-api"
version = "0.1.0"
description = "FaaS/CaaS REST API wrapping Knative on OpenShift"
requires-python = ">=3.14"
# What EVERY service needs. The build controller and the provisioner serve no
# HTTP and install nothing else, so their images carry no web stack
# (docs/BUILDING.md - Two images). pyyaml is declared even though kubernetes
# currently requires it: provisioner/templates.py imports it directly.
dependencies = [
    "cloudlet-apis>=0.6.2,<1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "kubernetes>=36.0.3",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
api = [
    "cloudlet-apis[web,auth]>=0.6.2,<1",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "pyyaml>=6.0.3",
    "tzdata>=2026.3",
]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff==0.16.4",
    "pip-audit>=2.10.1",
]

# PEP 8 enforcement. Run `ruff check .` to lint and `ruff format .` to format.
[tool.ruff]
line-length = 100
# No target-version: ruff derives it from `requires-python` above, so the Python
# version lives in one place (and a base-image bump can't leave ruff behind).

[tool.ruff.lint]
# pycodestyle (E/W), pyflakes (F), isort (I), pydocstyle (D) - PEP 8, import
# ordering, and Google-style docstrings. flake8-bugbear (B) for likely bugs and
# flake8-bandit (S) for security anti-patterns (the API has an SSRF/secret
# surface - see the code review).
select = ["E", "W", "F", "I", "D", "B", "S"]
# Require docstrings on modules, packages, classes, and public functions/methods.
# D105 (dunder methods) and D107 (__init__ - documented in the class docstring)
# stay optional, per the Google example.
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
# Google docstring style (Args:/Returns:/Raises:), per
# sphinxcontrib-napoleon's example_google.
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests carry long literal assertions (hosts, encoded blobs) and need no
# docstrings; they also use `assert` and fake credentials (flagged by bandit S)
# and loop/closure patterns bugbear (B) dislikes - all fine in test code.
"tests/**" = ["E501", "D", "S", "B"]

[tool.setuptools.packages.find]
include = ["api*", "common*", "controller*", "provisioner*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
