# Buildpack content for the kpack release, not for the serverless-api chart.
#
# `ClusterStack` and `ClusterStore` are cluster-scoped singletons, so they are
# created by the kpack chart alongside the controller that reconciles them
# (docs/DEPLOYING.md - Chart Topology). They stay here because the store and the
# builder orders in charts/serverless-api/values.yaml are one contract: every id
# an order names must have a source below, or that Builder never becomes Ready.
#
# Apply it to the kpack release, not to this chart:
#
#   helm upgrade --install kpack oci://ghcr.io/black-cloudlet/charts/kpack \
#     -n kpack --create-namespace \
#     -f charts/kpack-clusterbuild-values.yaml
#
# The airgap mirror scripts read this file by default (scripts/mirror/README.md).

clusterBuild:
  # Must equal `{registry.url}/{registry.organization}` from the serverless-api
  # values - builder images and the base images they are composed from have to
  # come from the same place (docs/BUILDING.md - Registry layout).
  registry: registry.internal

  # Identity kpack pulls the base images and buildpackages with. Separate from
  # the serverless-api chart's `kpack-builder` account, which pushes builder
  # images from the workloads namespace: this one only reads, and lives with the
  # cluster-scoped objects that reference it.
  serviceAccount:
    create: true
    name: kpack-cluster-build

  registrySecret:
    name: kpack-cluster-build-registry
    externalSecret:
      create: true
      secretStoreRef:
        name: cloudlet-cloudlet
        kind: ClusterSecretStore
      # Keyed by registry host alone: docker auth is per HOST, not per org path.
      registries:
        - registry.internal
      remoteRef:
        key: cloudlet/platforms/serverless
        usernameProperty: registry-username
        passwordProperty: registry-password

  stacks:
    # One shared stack serves all three builders (docs/BUILDING.md - Language
    # mapping). `id` must match both images' io.buildpacks.stack.id, and they
    # must be the same variant - check before switching to full/tiny, the ids
    # differ:
    #   docker inspect <image> --format '{{ index .Config.Labels "io.buildpacks.stack.id" }}'
    - name: serverless-base
      id: io.buildpacks.stacks.jammy
      # `full` only adds OS libraries, not language runtimes.
      buildImage:
        repository: paketobuildpacks/build-jammy-base
        tag: ""
      runImage:
        repository: paketobuildpacks/run-jammy-base
        tag: ""

  stores:
    # Individual components rather than the language composites, so the mirror
    # carries only the supported paths. An empty tag means latest - pin these
    # when airgapped, a floating tag can pull in a buildpack whose dependencies
    # were never mirrored (scripts/mirror/README.md prints the resolved tags).
    - name: serverless-store
      sources:
        # shared utilities
        - { repository: paketobuildpacks/ca-certificates, tag: "" }
        - { repository: paketobuildpacks/watchexec, tag: "" }
        - { repository: paketobuildpacks/git, tag: "" }
        - { repository: paketobuildpacks/procfile, tag: "" }
        - { repository: paketobuildpacks/environment-variables, tag: "" }
        - { repository: paketobuildpacks/image-labels, tag: "" }
        # go
        - { repository: paketobuildpacks/go-dist, tag: "" }
        - { repository: paketobuildpacks/go-mod-vendor, tag: "" }
        - { repository: paketobuildpacks/go-build, tag: "" }
        # python
        - { repository: paketobuildpacks/cpython, tag: "" }
        - { repository: paketobuildpacks/pip, tag: "" }
        - { repository: paketobuildpacks/pip-install, tag: "" }
        - { repository: paketobuildpacks/poetry, tag: "" }
        - { repository: paketobuildpacks/poetry-install, tag: "" }
        - { repository: paketobuildpacks/poetry-run, tag: "" }
        - { repository: paketobuildpacks/python-start, tag: "" }
        # node
        - { repository: paketobuildpacks/node-engine, tag: "" }
        - { repository: paketobuildpacks/npm-install, tag: "" }
        - { repository: paketobuildpacks/node-run-script, tag: "" }
        - { repository: paketobuildpacks/node-start, tag: "" }
        - { repository: paketobuildpacks/npm-start, tag: "" }
