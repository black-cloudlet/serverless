suite: container image reference
templates:
  - templates/deployment.yaml
tests:
  - it: defaults the tag to the chart appVersion when image.tag is empty
    # The committed baseline appVersion is "latest" (CI stamps the release tag).
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: registry.internal/serverless/serverless-api:latest

  - it: uses image.tag when it is set explicitly
    set:
      image.tag: "1.2.3"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: registry.internal/serverless/serverless-api:1.2.3

  - it: omits the registry prefix when image.registry is empty
    set:
      image.registry: ""
      image.tag: "9"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: serverless/serverless-api:9
