global:
  clusterName: example
  baseDomain: example.com
  site: example
  env: example

name: serverless-api

image:
  registry: registry.internal
  repository: serverless/serverless-api
  tag: "" 
  pullPolicy: IfNotPresent

replicaCount: 2

namespaces:
  # The API and everything that builds images (§2.1).
  api: serverless-api
  # Knative Services and their pods - what has been built, not the building.
  workloads: serverless-workloads
  labels: {}
  apiLabels: {}
  workloadsLabels: {}

# Wildcard domain for workload hosts ({name}-{group}.{routeDomain}).
routeDomain: serverless.example.com

corsAllowOrigins: []
#  - https://acme.service-now.com

sso:
  issuer: https://sso.internal/realms/serverless
  audience: ""
  swaggerClientId: serverless-api
  groupsClaim: groups
  adminGroups:
    - platform-admins

registry:
  url: registry.internal
  # Organization/project path segment, when the registry namespaces its repos
  # (Harbor projects, Quay/GitLab orgs, Artifactory repo keys). Prefixes every
  # image the chart references and every image the API builds. Leave empty for
  # a flat registry. Not part of the pull-secret auth key - docker keys those
  # by host.
  organization: ""

# Function runtimes offered to clients, mounted as a file (see services.runtimes).
#
# Each entry resolves a runtime to the kpack Builder that builds it and to the
# build-time environment that selects the language version and points the package
# manager at the on-prem artifact server. `build.commonEnv` and the dependency
# mirror are merged into every entry's `buildEnv` when the ConfigMap is rendered,
# so the API applies one already-resolved list. See docs/BUILD-PIPELINE.md §4.
#
#   builder        Name of a `build.builders` entry (several runtimes may share one).
#   versionEnv     Buildpack env var that selects the language version.
#   defaultVersion Used when the caller does not request a version.
#   versions       Allow-list offered to callers. MUST be a subset of what the
#                  pinned buildpackage ships - there is no fallback download.
#   buildEnv       Extra build env (package-manager index URLs, ...).
runtimesMountPath: /etc/serverless/runtimes
runtimes:
  - name: python
    builder: python
    versionEnv: BP_CPYTHON_VERSION
    defaultVersion: "3.12"
    versions: ["3.11", "3.12", "3.13"]
    buildEnv: []
    # - { name: PIP_INDEX_URL, value: "https://artifactory.internal/artifactory/api/pypi/pypi/simple" }
  - name: go
    builder: go
    versionEnv: BP_GO_VERSION
    defaultVersion: "1.22"
    versions: ["1.21", "1.22"]
    buildEnv: []
    # - { name: GOPROXY, value: "https://artifactory.internal/artifactory/api/go/go,direct" }
    # - { name: GOSUMDB, value: "off" }
  - name: node
    builder: node
    versionEnv: BP_NODE_VERSION
    defaultVersion: "20"
    versions: ["18", "20", "22"]
    buildEnv: []
    # - { name: npm_config_registry, value: "https://artifactory.internal/artifactory/api/npm/npm/" }

# Function image builds (kpack + Cloud Native Buildpacks). docs/BUILD-PIPELINE.md.
#
# Created in `namespaces.api`, not `namespaces.workloads` (§2.1). All images
# resolve against `registry.url`, never a public registry.
build:
  # False where kpack is not installed; the API and its workloads still deploy.
  enabled: true

  # stack and store are cluster-scoped singletons, safe only because one
  # serverless-api release runs per cluster. Set `create: false` on all but one
  # if that changes - two releases would fight over the same object.
  stack:
    name: serverless-base
    create: true
    # Must match both images' io.buildpacks.stack.id, and they must be the same
    # variant. Check before switching to full/tiny - the ids differ:
    #   docker inspect <image> --format '{{ index .Config.Labels "io.buildpacks.stack.id" }}'
    id: io.buildpacks.stacks.jammy
    # `full` only adds OS libraries, not language runtimes (§14.3).
    buildImage:
      repository: paketobuildpacks/build-jammy-base
      version: ""
    runImage:
      repository: paketobuildpacks/run-jammy-base
      version: ""

  store:
    name: serverless-store
    create: true
    # Must provide every id used in the orders below. Individual components
    # rather than the language composites, so the mirror carries only the
    # supported paths. Empty `version` means latest - pin these when airgapped,
    # a floating tag can pull in a buildpack whose deps were never mirrored.
    sources:
      # shared utilities
      - { repository: paketobuildpacks/ca-certificates, version: "" }
      - { repository: paketobuildpacks/watchexec, version: "" }
      - { repository: paketobuildpacks/git, version: "" }
      - { repository: paketobuildpacks/procfile, version: "" }
      - { repository: paketobuildpacks/environment-variables, version: "" }
      - { repository: paketobuildpacks/image-labels, version: "" }
      # go
      - { repository: paketobuildpacks/go-dist, version: "" }
      - { repository: paketobuildpacks/go-mod-vendor, version: "" }
      - { repository: paketobuildpacks/go-build, version: "" }
      # python
      - { repository: paketobuildpacks/cpython, version: "" }
      - { repository: paketobuildpacks/pip, version: "" }
      - { repository: paketobuildpacks/pip-install, version: "" }
      - { repository: paketobuildpacks/poetry, version: "" }
      - { repository: paketobuildpacks/poetry-install, version: "" }
      - { repository: paketobuildpacks/poetry-run, version: "" }
      - { repository: paketobuildpacks/python-start, version: "" }
      # node
      - { repository: paketobuildpacks/node-engine, version: "" }
      - { repository: paketobuildpacks/npm-install, version: "" }
      - { repository: paketobuildpacks/node-run-script, version: "" }
      - { repository: paketobuildpacks/node-start, version: "" }
      - { repository: paketobuildpacks/npm-start, version: "" }

  # Builder images land in `{registry base}/{builderRepository}/{name}`; the
  # repo must exist and be writable by the build ServiceAccount.
  builderRepository: serverless/builders

  # Username the API pairs with each caller's git token in the basic-auth Secret
  # kpack clones with. GitHub and GitLab PATs ignore it; Bitbucket app passwords
  # need the real username, so override there.
  gitUsername: x-access-token

  # Identity the Builders run as - registry only, no git credential. Function
  # builds use a per-function account the API creates instead (§6).
  serviceAccount:
    name: kpack-builder
    # The one platform-wide build credential: kpack pushes the built image with
    # it, the build pod pulls the builder image with it, and every function's
    # KSVC pulls its image with it - so a function never supplies registry creds.
    registrySecret:
      name: serverless-registry-creds
      # False when the Secret is provided out-of-band.
      create: true
      key: cloudlet/platforms/serverless
      usernameProperty: registry-username
      passwordProperty: registry-password

  # Internal-CA trust for build pods, as a Kyverno mutation rather than the
  # Paketo ca-certificates binding: the binding misses `prepare`, which is where
  # kpack clones over TLS. Verification is never disabled (§5).
  caInjection:
    # Needs Kyverno. False if the CA is baked into the mirrored stack images.
    enabled: true
    # Not caBundle.mountPath (/etc/ssl/certs) - that would shadow the build
    # image's own trust store. This path plus per-tool env is additive.
    mountPath: /etc/serverless/ca
    # Fail rejects the build pod outright; Ignore would let it start without the
    # CA and die later with an opaque TLS error from pip/npm/git.
    failurePolicy: Fail

  # Redirects every buildpack runtime download to the on-prem artifact server;
  # required when airgapped. `{originalHost}` is substituted and the upstream
  # path appended, so a mirror of upstream layout needs no curation. A mirror
  # needing auth must use a `dependency-mirror` binding instead, to keep
  # credentials out of this ConfigMap (§14.4).
  # e.g. https://artifactory.internal/artifactory/deps/{originalHost}
  dependencyMirror: ""

  # Build env applied to every runtime, merged ahead of each runtime's buildEnv.
  commonEnv: []

  # Requests/limits for the build pod (kpack Image spec.build.resources). Builds
  # are far heavier than the function they produce - a dependency resolve plus a
  # compile - so without limits they are BestEffort and are the first thing
  # evicted under node pressure. One bound for every build: the variance that
  # matters is small function vs large one, not Go vs Node.
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi

  # One kpack Builder per entry. `order` takes ids, {id, optional} entries, or
  # explicit [{group: [...]}] groups (see the builderOrder helper).
  #
  # Groups are tried in order; the first whose non-optional buildpacks all
  # detect wins. They are spelled out rather than referencing the language
  # composites so the platform supports exactly the paths it mirrors - anything
  # else fails at `detect` instead of mid-build on an unmirrored download:
  #
  #   go      - vendored and non-vendored
  #   python  - requirements.txt (pip) and pyproject.toml (poetry)
  #   node    - npm; yarn is deliberately not offered
  #
  # Every id must exist in the ClusterStore or the Builder never becomes Ready;
  # `optional` governs detection, not presence.
  builders:
    # Two groups, differing only by go-mod-vendor: vendored apps take the
    # first, everything else falls through to the second and needs GOPROXY.
    - name: go
      order:
        - group:
            - { id: paketo-buildpacks/ca-certificates, optional: true }
            - { id: paketo-buildpacks/watchexec, optional: true }
            - { id: paketo-buildpacks/go-dist }
            - { id: paketo-buildpacks/git, optional: true }
            - { id: paketo-buildpacks/go-mod-vendor }
            - { id: paketo-buildpacks/go-build }
            - { id: paketo-buildpacks/procfile, optional: true }
            - { id: paketo-buildpacks/environment-variables, optional: true }
            - { id: paketo-buildpacks/image-labels, optional: true }
        - group:
            - { id: paketo-buildpacks/ca-certificates, optional: true }
            - { id: paketo-buildpacks/watchexec, optional: true }
            - { id: paketo-buildpacks/go-dist }
            - { id: paketo-buildpacks/git, optional: true }
            - { id: paketo-buildpacks/go-build }
            - { id: paketo-buildpacks/procfile, optional: true }
            - { id: paketo-buildpacks/environment-variables, optional: true }
            - { id: paketo-buildpacks/image-labels, optional: true }
    # pip first, then the two poetry variants (poetry-run vs python-start).
    # pipenv and conda groups are omitted - their dependencies are not mirrored.
    - name: python
      order:
        - group:
            - { id: paketo-buildpacks/ca-certificates, optional: true }
            - { id: paketo-buildpacks/watchexec, optional: true }
            - { id: paketo-buildpacks/cpython }
            - { id: paketo-buildpacks/pip }
            - { id: paketo-buildpacks/pip-install }
            - { id: paketo-buildpacks/python-start }
            - { id: paketo-buildpacks/procfile, optional: true }
            - { id: paketo-buildpacks/environment-variables, optional: true }
            - { id: paketo-buildpacks/image-labels, optional: true }
        - group:
            - { id: paketo-buildpacks/ca-certificates, optional: true }
            - { id: paketo-buildpacks/watchexec, optional: true }
            - { id: paketo-buildpacks/cpython }
            - { id: paketo-buildpacks/pip }
            - { id: paketo-buildpacks/poetry }
            - { id: paketo-buildpacks/poetry-install }
            - { id: paketo-buildpacks/poetry-run }
            - { id: paketo-buildpacks/procfile, optional: true }
            - { id: paketo-buildpacks/environment-variables, optional: true }
            - { id: paketo-buildpacks/image-labels, optional: true }
        - group:
            - { id: paketo-buildpacks/ca-certificates, optional: true }
            - { id: paketo-buildpacks/watchexec, optional: true }
            - { id: paketo-buildpacks/cpython }
            - { id: paketo-buildpacks/pip }
            - { id: paketo-buildpacks/poetry }
            - { id: paketo-buildpacks/poetry-install }
            - { id: paketo-buildpacks/python-start }
            - { id: paketo-buildpacks/procfile, optional: true }
            - { id: paketo-buildpacks/environment-variables, optional: true }
            - { id: paketo-buildpacks/image-labels, optional: true }
    # npm only. The upstream yarn group is omitted, so a yarn.lock app fails at
    # detect rather than requiring the yarn dependencies to be mirrored.
    - name: node
      order:
        - group:
            - { id: paketo-buildpacks/ca-certificates, optional: true }
            - { id: paketo-buildpacks/watchexec, optional: true }
            - { id: paketo-buildpacks/node-engine }
            - { id: paketo-buildpacks/npm-install }
            - { id: paketo-buildpacks/node-run-script, optional: true }
            - { id: paketo-buildpacks/node-start, optional: true }
            - { id: paketo-buildpacks/npm-start, optional: true }
            - { id: paketo-buildpacks/procfile, optional: true }
            - { id: paketo-buildpacks/environment-variables, optional: true }
            - { id: paketo-buildpacks/image-labels, optional: true }

sites:
  - name: central                 
    cluster: central-0        
  - name: south
    cluster: south-0

certificate:
  name: serverless-client-cert
  user: serverless-api.client.example.com
  mountPath: /etc/serverless/client
  issuerRef:
    name: client-cert-acme
    kind: ClusterIssuer

caBundle:
  name: ca-bundle
  key: ca-bundle.crt
  mountPath: /etc/ssl/certs

externalSecrets:
  clusterSecretStore: cloudlet-cloudlet
  refreshInterval: 1h
  secrets:
    - name: serverless-api-keys
      data:
        - secretKey: SERVERLESS_ADMIN_API_KEY
          key: cloudlet/platforms/serverless
          property: admin-api-key

service:
  portName: http
  targetPort: 8080
  port: 80

# The OpenShift Route exposing the API.
route:
  host: ""
  labels: {}
  annotations: {}

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 512Mi

# Default-deny NetworkPolicies isolating workload pods from each other and other
# namespaces. Verify namespace names + CIDRs match your cluster.
networkPolicy:
  enabled: true
  # Namespaces allowed to connect TO workload pods.
  ingressNamespaces:
    - knative-serving # activator (scale-from-zero)
    - knative-serving-ingress # Kourier ingress gateway
    - openshift-ingress # OpenShift router (Routes)
    - openshift-monitoring # Prometheus scrape
  # Namespaces workload pods may connect TO (the API namespace is always added).
  egressNamespaces:
    - knative-serving # autoscaler / webhook
  dnsNamespace: openshift-dns
  # Off-cluster egress (LBs/Routes/external); internal CIDRs excluded so pods
  # can't reach other pods/Services directly. Set to YOUR cluster's CIDRs.
  externalEgress:
    cidr: 0.0.0.0/0
    exceptCIDRs:
      - 10.128.0.0/14 # pod network
      - 172.30.0.0/16 # service network

  # Build pods share the workloads namespace and its default-deny, but need to
  # reach things tenant pods must not: git, the registry, the artifact mirror.
  # NetworkPolicies are additive, so this opens those paths for pods labelled
  # `kpack.io/build` ONLY - the tenant allowlist above is untouched.
  #
  # The off-cluster rule above already covers a git/registry/mirror that lives
  # outside the cluster; `egressCIDRs` is for the ones that do not, since the
  # internal pod and service CIDRs are excluded there.
  build:
    enabled: true
    # Namespaces allowed to reach build pods. kpack drives builds through the
    # API server and reads logs via the kubelet, so nothing normally connects
    # in; this is here for a kpack that grows a direct call.
    ingressNamespaces:
      - kpack
    # Namespaces build pods may reach - an in-cluster registry or git server.
    egressNamespaces: []
    # In-cluster CIDRs for the same, when they are not a namespace you can name.
    egressCIDRs: []
