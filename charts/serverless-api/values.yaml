global:
  clusterName: example
  baseDomain: example.com
  site: example
  env: example

name: serverless-api

image:
  # Split registry/repository so the registry can be swapped per environment
  # (e.g. the airgapped mirror). registry is optional; leave empty to bake it
  # into repository instead.
  registry: registry.internal
  repository: serverless/serverless-api
  # Empty -> defaults to the chart appVersion (see the serverless-api.image
  # helper): "latest" on main, the release version on a tagged build.
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 2

namespaces:
  api: serverless-api
  workloads: serverless-workloads

routeDomain: serverless.example.com

corsAllowOrigins: []
#  - https://acme.service-now.com

sso:
  issuer: https://sso.internal/realms/serverless
  audience: ""
  swaggerClientId: serverless-api
  groupsClaim: groups
  adminGroups:
    - platform-admins

registry:
  url: registry.internal

sites:
  - name: central                 
    cluster: central-0        
  - name: south
    cluster: south-0

certificate:
  name: serverless-client-cert
  user: serverless-api.client.example.com
  mountPath: /etc/serverless/client
  issuerRef:
    name: client-cert-acme
    kind: ClusterIssuer

caBundle:
  name: ca-bundle
  key: ca-bundle.crt
  mountPath: /etc/ssl/certs

externalSecrets:
  clusterSecretStore: cloudlet-cloudlet
  refreshInterval: 1h
  secrets:
    - name: serverless-api-keys
      data:
        - secretKey: SERVERLESS_ADMIN_API_KEY
          key: cloudlet/platforms/serverless
          property: admin-api-key

service:
  portName: http
  targetPort: 8080
  port: 80

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 512Mi

# NetworkPolicies for the workloads namespace: default-deny, then allow only the
# paths Knative + OpenShift need, plus egress to the platform API, DNS, and
# off-cluster destinations (LBs / Routes). Workloads are thereby isolated from
# each other and from other namespaces. Verify the namespace names + CIDRs match
# your cluster (OpenShift Serverless defaults shown).
networkPolicy:
  enabled: true
  # Namespaces allowed to open connections TO workload pods.
  ingressNamespaces:
    - knative-serving # activator (scale-from-zero request proxy)
    - knative-serving-ingress # Kourier gateway (OpenShift Serverless ingress)
    - openshift-ingress # OpenShift router (Routes)
    - openshift-monitoring # Prometheus scrape of queue-proxy metrics
  # Namespaces workload pods may connect TO (the API namespace is always added).
  egressNamespaces:
    - knative-serving # autoscaler / webhook
  dnsNamespace: openshift-dns
  # Off-cluster egress (LBs, Routes, external services). The cluster-internal
  # networks are excluded so pods can't reach other pods/Services directly -
  # traffic to platform services goes via a Route/LB. Set to YOUR cluster's CIDRs.
  externalEgress:
    cidr: 0.0.0.0/0
    exceptCIDRs:
      - 10.128.0.0/14 # OVN-Kubernetes pod network (verify)
      - 172.30.0.0/16 # service network (verify)
