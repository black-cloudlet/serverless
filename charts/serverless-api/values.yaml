global:
  baseDomain: example.com
  # Which of `regions` below THIS release is; must match a `regions[].name` (or
  # its cluster) for the chart to render. Every region names its own registry,
  # so the release must always be able to tell which one it builds into.
  region: central

# Base name for everything the chart creates. The build controller's objects are
# named `{name}-build-controller`.
name: serverless-api

# Shared by both deployments, so a mirrored install overrides the registry and
# the pull policy once. Repository and per-deployment overrides are in `api` and
# `buildController` below.
image:
  registry: ghcr.io/black-cloudlet
  # Empty takes the chart's appVersion, so a released chart pins its own images.
  tag: ""
  pullPolicy: IfNotPresent

# The REST API (docs/ARCHITECTURE.md). The only deployment clients reach, hence
# the Service and Route.
api:
  repository: serverless/api
  # Overrides image.tag for this deployment only; normally left empty.
  tag: ""
  replicaCount: 2
  # `labels`/`annotations` on the Deployment, `podLabels`/`podAnnotations` on
  # its pods. The selector is left alone - immutable once it exists.
  labels: {}
  annotations: {}
  podLabels: {}
  # podAnnotations:
  #   prometheus.io/scrape: "true"
  podAnnotations: {}

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      # The health probes share the process's one event loop with everything
      # else it serves, and a CPU limit is enforced as throttling - at "1" a
      # streaming burst stretched into multi-second stalls that missed the 5s
      # probe timeout and restarted the pod. "2" gives the loop headroom to
      # answer while the stream threads work; the request stays low, so the
      # slack is only used when the node has it.
      cpu: "2"
      memory: 512Mi

  service:
    portName: http
    targetPort: 8080
    port: 80

  # The OpenShift Route exposing the API.
  route:
    # -- Defaults to serverless.{global.baseDomain}.
    host: ""
    labels: {}
    # -- How long HAProxy holds a connection open before cutting it.
    # This exists for the SSE endpoints (/pods, /logs/pods/{pod}, /stats/stream): the router
    # default is 30s, which would sever every stream half a minute in, and the
    # client would reconnect forever without ever noticing why. It MUST exceed
    # `stream.maxSeconds` below, so a stream ends the way it intends to - itself,
    # cleanly - rather than being cut mid-event by the router.
    #
    # The cost is that it applies to the whole Route, not just the streams:
    # OpenShift has no per-path timeout. An ordinary request cannot actually sit
    # here that long - the API bounds its own cluster work with
    # `SERVERLESS_CLUSTER_OP_TIMEOUT` - but a client that stops reading a response does hold a
    # connection until this expires.
    timeout: 65m
    # annotations:
    #   haproxy.router.openshift.io/balance: roundrobin
    annotations: {}

# Rolls each finished build's digest onto the function's Knative Service in this
# region (docs/BUILDING.md - Digest propagation). Serves no HTTP, so no Service and no Route.
buildController:
  # `build.enabled: false` with this on is a render-time error: the chart would
  # grant no read on images.kpack.io.
  enabled: true
  repository: serverless/build-controller
  tag: ""
  # More is safe but redundant: replicas converge rather than race, which is why
  # there is no leader election (docs/BUILDING.md - Convergence rules).
  replicaCount: 1
  labels: {}
  annotations: {}
  podLabels: {}
  podAnnotations: {}

  # A watch and an occasional apply; far lighter than the API.
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

  # How long each watch is held open, and so also the full-relist interval.
  resyncSeconds: 300

  # Prune the unique b{n}.{date}.{time} tag kpack pushes per build, in this
  # region's registry only - they accumulate for the life of the function and
  # count against quota (docs/BUILDING.md - Registry tag GC). Runs only when
  # `registry.deleteOnFunctionDelete` is true (the platform-wide "may we
  # delete registry content" switch) and a registry.apiTokens token exists;
  # otherwise the controller logs the GC off and does nothing. Kept per
  # function: the current branch tag, every tag on the digest still serving,
  # and the `keepBuilds` newest build tags beyond those.
  gc:
    enabled: true
    # Hours-scale: garbage accrues one tag per build, and every sweep
    # re-derives everything, so nothing is lost by waiting.
    intervalSeconds: 21600
    # Newest per-build tags kept beyond the protected ones. 0 is fine here and
    # is not the same choice as build.history.success: this prunes registry
    # TAGS, and the tag on the digest still serving is protected either way.
    keepBuilds: 0

namespaces:
  # The API itself. Builds and workloads live in `workloads` below.
  api: serverless-api
  # Knative Services and their pods - what has been built, not the building.
  workloads: serverless-workloads
  # -- Labels for both namespaces; the two below add to (and override) them.
  # labels:
  #   team: platform
  labels: {}
  # apiLabels:
  #   pod-security.kubernetes.io/enforce: restricted
  apiLabels: {}
  workloadsLabels: {}

# Wildcard domain for workload hosts ({name}-{group}.{routeDomain}).
routeDomain: serverless.example.com

# The path the API is served under. Everything hangs off it - the endpoints at
# {basePath}/v1/..., the docs and their assets, the OpenAPI document, the SSO
# token proxy - so a client's whole URL reads:
#
#   https://{host}/api/serverless/v1/groups/{group}/functions
#
# Naming it for the API is what lets it share a host with the platform's others.
# Only /healthz and /readyz sit outside it, since the kubelet reaches the pod
# directly rather than through whatever serves the API to everyone else.
#
# Whatever does that serving must forward the path WHOLE - a plain Route with
# `spec.path`, no haproxy.router.openshift.io/rewrite-target. There is one path
# per endpoint and it is the complete one, so a router that strips the leading
# segments leaves nothing that matches.
basePath: /api/serverless

# Each entry is rendered with tpl, so an origin can be derived from other
# values instead of repeated per environment. Origins must be the exact form
# the browser sends: scheme + host (+ port), no trailing slash - the API
# matches them verbatim.
corsAllowOrigins: []
#  - https://portal.{{ .Values.global.baseDomain }}
#  - https://acme.service-now.com

# Bounds on the Server-Sent Events endpoints (/pods, /logs/pods/{pod}, /stats/stream).
# These are not performance tuning. A followed pod log holds a worker thread for
# as long as the client stays connected, so the API gives streaming a thread pool
# of its own and refuses the stream that would overrun it, rather than letting
# held-open connections take the threads ordinary requests need.
# docs/ARCHITECTURE.md - Streaming.
stream:
  # Open streams one replica will serve. Beyond this a stream is refused with
  # 503 and a retry, which is strictly better than being connected and starved.
  # The thread pool is sized from this (two threads each), so raising it raises
  # the pool. Streams are per pod, so a user watching four pods of one workload
  # spends four - which is why this is far above the old workload-level default.
  maxConcurrent: 32
  # How often a pods or stats stream re-reads. A client may ask for its own
  # within [minIntervalSeconds, maxIntervalSeconds]; anything outside is clamped.
  intervalSeconds: 5
  minIntervalSeconds: 1
  maxIntervalSeconds: 60
  # A quiet stream sends a comment this often so nothing in the path reaps it.
  # Keep it well under api.route.timeout.
  heartbeatSeconds: 15
  # Log lines held for a client that reads slower than the workload writes.
  # Past this, lines are dropped and the gap is reported - never grown into.
  queueSize: 1000
  # Bytes that buffer may hold, whatever queueSize still allows. The line bound
  # alone is no bound for a pod writing without newlines - each "line" then
  # arrives as a ~1MB piece, and queueSize of those is a gigabyte per stream.
  queueMaxBytes: 2097152
  # How long one stream lives before ending itself; the client reconnects on its
  # own. MUST stay under api.route.timeout, so a stream is never cut mid-event.
  maxSeconds: 3600
  # Lifetime of a stream ticket. It is spent opening one connection, so this is
  # a window, not a session.
  ticketTtlSeconds: 60
  # Bounds on the one-shot log snapshot (`?follow=false`). The node may hold
  # tens of megabytes for one container, and an unbounded snapshot is parsed
  # into a single response - large enough, that is the API's memory and the
  # event loop's time, which is exactly what fails the health probes when a
  # client polls it. A snapshot returns the newest `snapshotTailLines` lines,
  # and never reads more than `snapshotMaxBytes` (a caller's `limitBytes` is
  # clamped to it) - a backstop for pathological line lengths.
  snapshotTailLines: 2000
  snapshotMaxBytes: 2097152

sso:
  # Templated, so it can be derived rather than repeated per environment.
  issuer: https://sso.internal/realms/serverless
  audience: ""
  # Must match the client id registered in the realm - NOT this release name,
  # which is what it read before. A mismatch fails the docs login at the
  # authorize step, with an error only Keycloak's log explains.
  swaggerClientId: serverless-api-swagger
  groupsClaim: groups
  adminGroups:
    - platform-admins

# Platform default; a region may override the host under `regions[].registry`.
registry:
  url: registry.internal
  organization: ""

  # May the platform delete registry content at all? Governs both cleanups:
  # a deleted function's repositories AND the build controller's tag GC
  # (buildController.gc). False stops every registry delete with the tokens
  # still mounted. Needs the tokens below; without them, both are skipped.
  # docs/BUILDING.md - Registry cleanup on delete, Registry tag GC.
  deleteOnFunctionDelete: true

  # One Quay OAuth token per region (Organization -> Applications, scoped
  # `repo:admin` - NOT the push robot, which cannot call Quay's management API),
  # read from one Vault entry each and assembled into a single variable: a delete
  # reclaims repositories in every region from whichever instance took the request.
  # `{region}` is substituted per region.
  apiTokens:
    create: true
    secretName: serverless-api-registry-tokens
    key: "cloudlet/platforms/serverless/{region}"
    property: registry-api-token

# Runtimes offered to clients, mounted as a file. Keys: builder (a build.builders
# entry), versionEnv, defaultVersion, versions (must be a subset of what the
# pinned buildpackage ships), buildEnv. commonEnv and dependencyMirror are merged
# into buildEnv at render time. docs/BUILDING.md - Runtime Versions & Dependencies.
runtimesMountPath: /etc/serverless/runtimes
runtimes:
  - name: python
    builder: python
    versionEnv: BP_CPYTHON_VERSION
    defaultVersion: "3.12"
    versions: ["3.11", "3.12", "3.13"]
    buildEnv:
      - name: PIP_INDEX_URL
        value: "https://artifactory.internal/artifactory/api/pypi/pypi/simple"
  - name: go
    builder: go
    versionEnv: BP_GO_VERSION
    defaultVersion: "1.24"
    versions: ["1.23", "1.24", "1.25"]
    buildEnv:
      - name: GOPROXY
        value: "https://artifactory.internal/artifactory/api/go/go,direct"
      - name: GOSUMDB
        value: "off"
  - name: node
    builder: node
    versionEnv: BP_NODE_VERSION
    defaultVersion: "20"
    versions: ["18", "20", "22"]
    buildEnv:
      - name: npm_config_registry
        value: "https://artifactory.internal/artifactory/api/npm/npm/"

# Function image builds (kpack + Cloud Native Buildpacks). docs/BUILDING.md.
# Everything lands in `namespaces.workloads` and resolves against `registry.url`.
build:
  # False where kpack is not installed; the API and its workloads still deploy.
  enabled: true

  # References to cluster-scoped objects the kpack release creates
  # (clusterBuild.stacks / clusterBuild.stores). Names must match, and the store
  # must provide every id the orders below name - kpack reports a mismatch on
  # the Builder's status, nothing checks it here.
  stack:
    name: serverless-base

  store:
    name: serverless-store

  # The path segment everything the platform builds sits under, so one root
  # covers both: Builder images at `{registry base}/{builderRepository}/{name}`
  # and function images at `{registry base}/{builderRepository}/{group}/{name}`
  # (reaching the API as SERVERLESS_REGISTRY__REPOSITORY). The repo must exist
  # and be writable by the build ServiceAccount. Changing it on an install that
  # already has functions is a migration, not a config edit
  # (docs/BUILDING.md - Registry layout). Templated, but it must resolve to the
  # SAME string in every region: only the registry HOST varies per region, and each
  # release computes this path for its peers too.
  builderRepository: serverless/builders

  # Username paired with each caller's git token. GitHub/GitLab PATs ignore it;
  # Bitbucket app passwords need the real username.
  gitUsername: x-access-token

  # Read-only registry holding kpack's own images and the ClusterStack/
  # ClusterStore content: pulled by every region, written by none, mirrored once.
  # Empty `url` means it IS the region registry (today's behaviour) - no second
  # Secret, nothing added to the build accounts.
  kpackRegistry:
    # The host the kpack release uses for `images.registry` and
    # `clusterBuild.registry`. e.g. registry.kpack.internal
    url: ""
    # Pull-only, and needed on BOTH build accounts: `export` pulls the run image.
    pullSecret:
      name: kpack-registry-creds
      # False when the Secret is provided out-of-band.
      create: true
      key: cloudlet/platforms/serverless
      usernameProperty: kpack-registry-username
      passwordProperty: kpack-registry-password

  # Identity the Builders run as - registry only, no git credential. Function
  # builds use a per-function account the API creates.
  serviceAccount:
    name: kpack-builder
    # This REGION's build credential: kpack pushes with it, the build pod and every
    # function's KSVC here pull with it. The NAME is identical in every region - it
    # is written into every region's KSVC - while the contents differ, so the Vault
    # path is per region.
    registrySecret:
      name: serverless-registry-creds
      # False when the Secret is provided out-of-band.
      create: true
      key: "cloudlet/platforms/serverless/{{ .Values.global.region }}"
      usernameProperty: registry-username
      passwordProperty: registry-password

  # OpenShift only: a least-privilege SCC letting build pods run as the builder
  # image's uid, which restricted-v2 rejects. Without it every build is refused
  # at admission. docs/DEPLOYING.md - OpenShift SCC for builds.
  scc:
    enabled: false
    name: kpack-build
    # The builder image's CNB_USER_ID / CNB_GROUP_ID. They differ: the Paketo
    # jammy images run as uid 1001, gid 1000.
    runAsUser: 1001
    fsGroup: 1000
    # Bind to the namespace's SA group - per-function build accounts are named
    # at request time. False binds `build.serviceAccount.name` and those below.
    allServiceAccounts: true
    # serviceAccounts:
    #   - fn-my-function
    serviceAccounts: []
    # `persistentVolumeClaim` is only for kpack's volume build cache.
    volumes:
      - configMap
      - downwardAPI
      - emptyDir
      - persistentVolumeClaim
      - projected
      - secret

  # Internal-CA trust for build pods, as a Kyverno mutation - the Paketo
  # ca-certificates binding misses `prepare`, where kpack clones over TLS.
  # docs/BUILDING.md - Trust: CA Injection.
  caInjection:
    # Needs Kyverno. False if the CA is baked into the mirrored stack images.
    enabled: true
    # NOT /etc/ssl/certs - that would shadow the build image's own trust store.
    mountPath: /etc/serverless/ca
    # Fail rejects the build pod; Ignore lets it start and die on an opaque TLS error.
    failurePolicy: Fail

  # Redirects every buildpack download to the on-prem artifact server; required
  # when airgapped. `{originalHost}` is required, not cosmetic. A mirror needing
  # auth must use a `dependency-mirror` binding instead, to keep credentials out
  # of this ConfigMap.
  # dependencyMirror: https://artifactory.internal/deps/{originalHost}
  dependencyMirror: ""

  # Build env applied to every runtime, merged ahead of each runtime's buildEnv.
  # commonEnv:
  #   - name: BP_OCI_SOURCE
  #     value: https://git.internal
  commonEnv: []

  # Build layer cache: `registry` (at `{base}/{group}/{name}_cache`) or
  # `inherit`, taking kpack's default of a PVC per function.
  # docs/BUILDING.md - Build cache.
  cache: registry

  # Builds kpack keeps per function, successful and failed counted separately.
  # Each one holds its completed pod until it is collected, so the namespace
  # carries `(success + failed) x functions` pods at worst. Left unset these are
  # kpack's own defaults - 10 and 10, i.e. 20 per function - which is a few
  # thousand pods across a few hundred functions. Failed builds are worth
  # keeping a couple of: their pods hold the per-phase logs.
  # docs/BUILDING.md - Build history.
  # Minimum 1, not 0, because kpack itself refuses less than 1 - its Image
  # webhook answers "build history limit must be greater than 0", and its
  # defaulting only fills an ABSENT limit, so an explicit 0 reaches that check.
  # An Image with 0 therefore cannot be created at all: every function create
  # and update would fail admission. The API mirrors the floor, which is why a
  # release that shipped `success: 0` crash-looped instead of starting.
  history:
    success: 1
    failed: 1

  # Build pod requests/limits. A build is far heavier than the function it
  # produces; without these it is BestEffort and evicted first under pressure.
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi

  # One kpack Builder per entry. Groups are tried in order; the first whose
  # non-optional buildpacks all detect wins. Components are spelled out rather
  # than using the language composites, so an unsupported path fails at `detect`
  # instead of mid-build. docs/BUILDING.md - Buildpack Topology.
  #
  # `order` accepts three shapes, so a Paketo order can be pasted in verbatim.
  # The entries below use the third; the first two are shorthand for one group:
  #
  #   order: [paketo-buildpacks/go-dist, paketo-buildpacks/go-build]
  #   order:
  #     - { id: paketo-buildpacks/go-dist }
  #     - { id: paketo-buildpacks/git, optional: true }
  #   order:
  #     - group:
  #         - { id: paketo-buildpacks/go-dist }
  #         - { id: paketo-buildpacks/git, optional: true }
  #
  # `optional` governs detection, not presence: every id must still exist in the
  # ClusterStore or the Builder never becomes Ready.
  builders:
    # Two groups differing only by go-mod-vendor: vendored apps take the first,
    # everything else falls through to the second and needs GOPROXY.
    - name: go
      order:
        - group:
            - { id: paketo-buildpacks/ca-certificates, optional: true }
            - { id: paketo-buildpacks/watchexec, optional: true }
            - { id: paketo-buildpacks/go-dist }
            - { id: paketo-buildpacks/git, optional: true }
            - { id: paketo-buildpacks/go-mod-vendor }
            - { id: paketo-buildpacks/go-build }
            - { id: paketo-buildpacks/procfile, optional: true }
            - { id: paketo-buildpacks/environment-variables, optional: true }
            - { id: paketo-buildpacks/image-labels, optional: true }
        - group:
            - { id: paketo-buildpacks/ca-certificates, optional: true }
            - { id: paketo-buildpacks/watchexec, optional: true }
            - { id: paketo-buildpacks/go-dist }
            - { id: paketo-buildpacks/git, optional: true }
            - { id: paketo-buildpacks/go-build }
            - { id: paketo-buildpacks/procfile, optional: true }
            - { id: paketo-buildpacks/environment-variables, optional: true }
            - { id: paketo-buildpacks/image-labels, optional: true }
    # pip first, then the two poetry variants. pipenv and conda are omitted.
    - name: python
      order:
        - group:
            - { id: paketo-buildpacks/ca-certificates, optional: true }
            - { id: paketo-buildpacks/watchexec, optional: true }
            - { id: paketo-buildpacks/cpython }
            - { id: paketo-buildpacks/pip }
            - { id: paketo-buildpacks/pip-install }
            - { id: paketo-buildpacks/python-start }
            - { id: paketo-buildpacks/procfile, optional: true }
            - { id: paketo-buildpacks/environment-variables, optional: true }
            - { id: paketo-buildpacks/image-labels, optional: true }
        - group:
            - { id: paketo-buildpacks/ca-certificates, optional: true }
            - { id: paketo-buildpacks/watchexec, optional: true }
            - { id: paketo-buildpacks/cpython }
            - { id: paketo-buildpacks/pip }
            - { id: paketo-buildpacks/poetry }
            - { id: paketo-buildpacks/poetry-install }
            - { id: paketo-buildpacks/poetry-run }
            - { id: paketo-buildpacks/procfile, optional: true }
            - { id: paketo-buildpacks/environment-variables, optional: true }
            - { id: paketo-buildpacks/image-labels, optional: true }
        - group:
            - { id: paketo-buildpacks/ca-certificates, optional: true }
            - { id: paketo-buildpacks/watchexec, optional: true }
            - { id: paketo-buildpacks/cpython }
            - { id: paketo-buildpacks/pip }
            - { id: paketo-buildpacks/poetry }
            - { id: paketo-buildpacks/poetry-install }
            - { id: paketo-buildpacks/python-start }
            - { id: paketo-buildpacks/procfile, optional: true }
            - { id: paketo-buildpacks/environment-variables, optional: true }
            - { id: paketo-buildpacks/image-labels, optional: true }
    # npm only; a yarn.lock app fails at detect rather than needing yarn mirrored.
    - name: node
      order:
        - group:
            - { id: paketo-buildpacks/ca-certificates, optional: true }
            - { id: paketo-buildpacks/watchexec, optional: true }
            - { id: paketo-buildpacks/node-engine }
            - { id: paketo-buildpacks/npm-install }
            - { id: paketo-buildpacks/node-run-script, optional: true }
            - { id: paketo-buildpacks/node-start, optional: true }
            - { id: paketo-buildpacks/npm-start, optional: true }
            - { id: paketo-buildpacks/procfile, optional: true }
            - { id: paketo-buildpacks/environment-variables, optional: true }
            - { id: paketo-buildpacks/image-labels, optional: true }

# A region is one deployment location; its cluster's API server is DERIVED as
# https://api.{cluster}.{global.baseDomain}:6443, so there is no endpoint to set.
# Identical in every cluster - an instance composes the peer's manifests from it,
# so nothing per-release goes here (that is `global.region`). No credentials
# here - this renders into a ConfigMap.
#
# Every region MUST set `registry.url`, and no two regions may share one: a region
# builds into and prunes its own registry (docs/BUILDING.md - Registry tag GC),
# and two regions on one registry would garbage-collect each other's serving
# images. The chart refuses to render either mistake. `organization` and
# `repository` are optional and inherited from `registry` above unless set.
regions:
  - name: central
    cluster: central-0
    registry:
      url: registry.central.internal
  - name: south
    cluster: south-0
    registry:
      url: registry.south.internal

certificate:
  name: serverless-client-cert
  # The cert's CN/SAN, and therefore the Kubernetes *username* the RoleBinding
  # binds - both read this one value, so they cannot drift. ACME requires the
  # identity to be a DNS name (docs/ARCHITECTURE.md - Authentication & Authorization).
  user: serverless-api.clients.example.com
  mountPath: /etc/serverless/client
  issuerRef:
    name: client-cert-acme
    kind: ClusterIssuer

caBundle:
  name: ca-bundle
  key: ca-bundle.crt
  mountPath: /etc/ssl/certs

externalSecrets:
  clusterSecretStore: cloudlet-cloudlet
  refreshInterval: 1h
  secrets:
    - name: serverless-api-keys
      data:
        - secretKey: SERVERLESS_ADMIN_API_KEY
          key: cloudlet/platforms/serverless
          property: admin-api-key
        # HMAC key for stream tickets - what a browser opens an SSE endpoint
        # with, since EventSource cannot send an Authorization header. Signed
        # rather than stored, so every replica in every region verifies a ticket
        # any of them minted; that only works if they share this value. Unlike
        # the registry tokens below it is NOT per region - a stream can land on
        # either, so a per-region key would fail about half of them.
        # Leave the Vault property unset to disable ticket minting: the streams
        # still take the Authorization header, so only the browser path goes.
        - secretKey: SERVERLESS_STREAM_TICKET_KEY
          key: cloudlet/platforms/serverless
          property: stream-ticket-key
        # Only where the SSO realm forbids PUBLIC clients: the API then proxies
        # Swagger's token exchange so the client can be CONFIDENTIAL, and this
        # never leaves the pod (docs/ARCHITECTURE.md - The Swagger "Authorize"
        # client). Otherwise DELETE these three lines - an empty Vault property
        # fails the whole ExternalSecret, taking the other keys with it.
        - secretKey: SERVERLESS_SSO__SWAGGER_CLIENT_SECRET
          key: cloudlet/platforms/serverless
          property: swagger-client-secret

# Default-deny NetworkPolicies for workload pods. Verify the namespace names and
# CIDRs match your cluster.
networkPolicy:
  enabled: true
  # Namespaces allowed to connect TO workload pods.
  ingressNamespaces:
    - knative-serving # activator (scale-from-zero)
    - knative-serving-ingress # Kourier ingress gateway
    - openshift-ingress # OpenShift router (Routes)
    - openshift-monitoring # Prometheus scrape
  # Namespaces workload pods may connect TO (the API namespace is always added).
  egressNamespaces:
    - knative-serving # autoscaler / webhook
  dnsNamespace: openshift-dns
  # Pod ports, not Service ports - OpenShift's CoreDNS listens on 5353, kube-dns on 53.
  dnsPorts: [53, 5353]
  # Off-cluster egress. Internal CIDRs are excluded so pods cannot reach other
  # pods/Services directly - set these to YOUR cluster's CIDRs.
  externalEgress:
    cidr: 0.0.0.0/0
    exceptCIDRs:
      - 10.128.0.0/14 # pod network
      - 172.30.0.0/16 # service network

  # Build pods need git, the registry and the artifact mirror, which tenant pods
  # must not reach. NetworkPolicies are additive, so this opens those paths for
  # pods labelled `kpack.io/build` only. The off-cluster rule above already
  # covers anything outside the cluster; these are for in-cluster targets.
  build:
    enabled: true
    # kpack drives builds through the API server, so nothing normally connects
    # in; this is here for a kpack that grows a direct call.
    ingressNamespaces:
      - kpack
    # Namespaces build pods may reach - an in-cluster registry or git server.
    # egressNamespaces:
    #   - internal-registry
    egressNamespaces: []
    # In-cluster CIDRs for the same, when they are not a namespace you can name.
    # egressCIDRs:
    #   - 10.9.0.0/24
    egressCIDRs: []
