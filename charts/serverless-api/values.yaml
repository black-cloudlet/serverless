global:
  clusterName: example
  baseDomain: example.com
  site: example
  env: example

name: serverless-api

image:
  registry: registry.internal
  repository: serverless/serverless-api
  tag: "" 
  pullPolicy: IfNotPresent

replicaCount: 2

namespaces:
  api: serverless-api
  workloads: serverless-workloads
  labels: {}
  apiLabels: {}
  workloadsLabels: {}

# Wildcard domain for workload hosts ({name}-{group}.{routeDomain}).
routeDomain: serverless.example.com

corsAllowOrigins: []
#  - https://acme.service-now.com

sso:
  issuer: https://sso.internal/realms/serverless
  audience: ""
  swaggerClientId: serverless-api
  groupsClaim: groups
  adminGroups:
    - platform-admins

registry:
  url: registry.internal

# Function runtimes offered to clients, mounted as a file (see services.runtimes).
#
# Each entry resolves a runtime to the kpack Builder that builds it and to the
# build-time environment that selects the language version and points the package
# manager at the on-prem artifact server. `build.commonEnv` and the dependency
# mirror are merged into every entry's `buildEnv` when the ConfigMap is rendered,
# so the API applies one already-resolved list. See docs/BUILD-PIPELINE.md §4.
#
#   builder        Name of a `build.builders` entry (several runtimes may share one).
#   versionEnv     Buildpack env var that selects the language version.
#   defaultVersion Used when the caller does not request a version.
#   versions       Allow-list offered to callers. MUST be a subset of what the
#                  pinned buildpackage ships - there is no fallback download.
#   buildEnv       Extra build env (package-manager index URLs, ...).
runtimesMountPath: /etc/serverless/runtimes
runtimes:
  - name: python
    builder: python
    versionEnv: BP_CPYTHON_VERSION
    defaultVersion: "3.12"
    versions: ["3.11", "3.12", "3.13"]
    buildEnv: []
    # - { name: PIP_INDEX_URL, value: "https://artifactory.internal/artifactory/api/pypi/pypi/simple" }
  - name: go
    builder: go
    versionEnv: BP_GO_VERSION
    defaultVersion: "1.22"
    versions: ["1.21", "1.22"]
    buildEnv: []
    # - { name: GOPROXY, value: "https://artifactory.internal/artifactory/api/go/go,direct" }
    # - { name: GOSUMDB, value: "off" }
  - name: node
    builder: node
    versionEnv: BP_NODE_VERSION
    defaultVersion: "20"
    versions: ["18", "20", "22"]
    buildEnv: []
    # - { name: npm_config_registry, value: "https://artifactory.internal/artifactory/api/npm/npm/" }
  # Built by the Node.js buildpack (there is no separate TypeScript buildpack), so
  # it deliberately resolves to the same builder as `node`.
  - name: typescript
    builder: node
    versionEnv: BP_NODE_VERSION
    defaultVersion: "20"
    versions: ["18", "20", "22"]
    buildEnv: []

# Function image builds (kpack + Cloud Native Buildpacks). See docs/BUILD-PIPELINE.md.
#
# This chart owns the NAMESPACED pieces only: the Builders, the build
# ServiceAccount and its credentials. The cluster-scoped ClusterStack and
# ClusterStore are singletons installed once per cluster by the platform chart;
# they are referenced here by name.
build:
  # Set false on clusters where kpack is not installed - the API and its
  # workloads still deploy, only the build resources are omitted.
  enabled: true

  # Cluster-scoped objects installed by the platform chart, referenced by name.
  stack:
    name: serverless-base
  store:
    name: serverless-store

  # Composed builder images are pushed to `{registry.url}/{builderRepository}/{name}`.
  # This repository must exist and be writable by the build ServiceAccount.
  builderRepository: serverless/builders

  # Identity the BUILDERS run as. Builders only compose and push a builder image
  # from the stack and store - they never clone source, so this needs registry
  # credentials and no git credential.
  #
  # Function builds do NOT use this account: each function's git token is its
  # own (supplied by the caller), so the API creates a per-function
  # ServiceAccount pairing that function's git Secret with the shared registry
  # credential below. docs/BUILD-PIPELINE.md §6.
  serviceAccount:
    name: kpack-builder
    # One dockerconfigjson credential does double duty: kpack pushes the built
    # image with it, and the function's KSVC pulls the image with it. It is the
    # only build credential that is platform-wide, so it is the only one here.
    registrySecret:
      name: serverless-registry-creds
      # Create it from the ClusterSecretStore (see externalSecrets). Set false
      # when the Secret is provided out-of-band.
      create: true
      key: cloudlet/platforms/serverless
      usernameProperty: registry-username
      passwordProperty: registry-password

  # Redirects EVERY buildpack runtime download (CPython/Node/Go tarballs) to the
  # on-prem artifact server - required for airgapped builds. `{originalHost}` is
  # substituted with the upstream host and the upstream path is appended, so a
  # mirror of upstream layout needs no per-file curation.
  # A mirror requiring auth must be supplied as a `dependency-mirror` BINDING
  # instead, so credentials stay out of this ConfigMap. See §14.4.
  # e.g. https://artifactory.internal/artifactory/deps/{originalHost}
  dependencyMirror: ""

  # Build env applied to every runtime, merged ahead of each runtime's buildEnv.
  commonEnv: []

  # One namespaced kpack Builder per entry.
  #
  # `order` accepts three forms (see the builderOrder helper): a list of ids, a
  # list of {id, optional, version} entries forming one group, or explicit
  # [{group: [...]}] groups passed straight through to kpack.
  #
  # Orders are written out EXPLICITLY rather than referencing the language
  # composite ids, so the platform supports exactly the paths it mirrors and
  # nothing else. An app outside these groups fails cleanly at `detect` ("no
  # group passed") instead of dying mid-build on a download that was never
  # mirrored. Supported paths:
  #
  #   go      - vendored (vendor/) and non-vendored (go mod download)
  #   python  - requirements.txt (pip) and pyproject.toml (poetry)
  #   node    - npm (package-lock.json); yarn is deliberately NOT offered
  #
  # Groups are tried in order; the first whose non-optional buildpacks all
  # detect wins. Each group is copied verbatim from the upstream composite, so
  # behaviour matches Paketo exactly for the paths that are kept.
  #
  # Every id must exist in the ClusterStore or the Builder never becomes Ready
  # and nothing builds - `optional` governs detection, not whether a buildpack
  # has to be present. Narrowing the order does not shrink the image mirror
  # (a composite buildpackage carries all its components); it shrinks the
  # DEPENDENCY mirror, because only buildpacks that can run ever download.
  builders:
    # Two groups, differing only by go-mod-vendor: vendored apps take the
    # first, everything else falls through to the second and needs GOPROXY.
    - name: go
      order:
        - group:
            - { id: paketo-buildpacks/ca-certificates, optional: true }
            - { id: paketo-buildpacks/watchexec, optional: true }
            - { id: paketo-buildpacks/go-dist }
            - { id: paketo-buildpacks/git, optional: true }
            - { id: paketo-buildpacks/go-mod-vendor }
            - { id: paketo-buildpacks/go-build }
            - { id: paketo-buildpacks/procfile, optional: true }
            - { id: paketo-buildpacks/environment-variables, optional: true }
            - { id: paketo-buildpacks/image-labels, optional: true }
        - group:
            - { id: paketo-buildpacks/ca-certificates, optional: true }
            - { id: paketo-buildpacks/watchexec, optional: true }
            - { id: paketo-buildpacks/go-dist }
            - { id: paketo-buildpacks/git, optional: true }
            - { id: paketo-buildpacks/go-build }
            - { id: paketo-buildpacks/procfile, optional: true }
            - { id: paketo-buildpacks/environment-variables, optional: true }
            - { id: paketo-buildpacks/image-labels, optional: true }
    # pip first, then the two poetry variants (poetry-run vs python-start).
    # pipenv and conda groups are omitted - their dependencies are not mirrored.
    - name: python
      order:
        - group:
            - { id: paketo-buildpacks/ca-certificates, optional: true }
            - { id: paketo-buildpacks/watchexec, optional: true }
            - { id: paketo-buildpacks/cpython }
            - { id: paketo-buildpacks/pip }
            - { id: paketo-buildpacks/pip-install }
            - { id: paketo-buildpacks/python-start }
            - { id: paketo-buildpacks/procfile, optional: true }
            - { id: paketo-buildpacks/environment-variables, optional: true }
            - { id: paketo-buildpacks/image-labels, optional: true }
        - group:
            - { id: paketo-buildpacks/ca-certificates, optional: true }
            - { id: paketo-buildpacks/watchexec, optional: true }
            - { id: paketo-buildpacks/cpython }
            - { id: paketo-buildpacks/pip }
            - { id: paketo-buildpacks/poetry }
            - { id: paketo-buildpacks/poetry-install }
            - { id: paketo-buildpacks/poetry-run }
            - { id: paketo-buildpacks/procfile, optional: true }
            - { id: paketo-buildpacks/environment-variables, optional: true }
            - { id: paketo-buildpacks/image-labels, optional: true }
        - group:
            - { id: paketo-buildpacks/ca-certificates, optional: true }
            - { id: paketo-buildpacks/watchexec, optional: true }
            - { id: paketo-buildpacks/cpython }
            - { id: paketo-buildpacks/pip }
            - { id: paketo-buildpacks/poetry }
            - { id: paketo-buildpacks/poetry-install }
            - { id: paketo-buildpacks/python-start }
            - { id: paketo-buildpacks/procfile, optional: true }
            - { id: paketo-buildpacks/environment-variables, optional: true }
            - { id: paketo-buildpacks/image-labels, optional: true }
    # npm only. The upstream yarn group is omitted, so a yarn.lock app fails at
    # detect rather than requiring the yarn dependencies to be mirrored.
    - name: node
      order:
        - group:
            - { id: paketo-buildpacks/ca-certificates, optional: true }
            - { id: paketo-buildpacks/watchexec, optional: true }
            - { id: paketo-buildpacks/node-engine }
            - { id: paketo-buildpacks/npm-install }
            - { id: paketo-buildpacks/node-run-script, optional: true }
            - { id: paketo-buildpacks/node-start, optional: true }
            - { id: paketo-buildpacks/npm-start, optional: true }
            - { id: paketo-buildpacks/procfile, optional: true }
            - { id: paketo-buildpacks/environment-variables, optional: true }
            - { id: paketo-buildpacks/image-labels, optional: true }

sites:
  - name: central                 
    cluster: central-0        
  - name: south
    cluster: south-0

certificate:
  name: serverless-client-cert
  user: serverless-api.client.example.com
  mountPath: /etc/serverless/client
  issuerRef:
    name: client-cert-acme
    kind: ClusterIssuer

caBundle:
  name: ca-bundle
  key: ca-bundle.crt
  mountPath: /etc/ssl/certs

externalSecrets:
  clusterSecretStore: cloudlet-cloudlet
  refreshInterval: 1h
  secrets:
    - name: serverless-api-keys
      data:
        - secretKey: SERVERLESS_ADMIN_API_KEY
          key: cloudlet/platforms/serverless
          property: admin-api-key

service:
  portName: http
  targetPort: 8080
  port: 80

# The OpenShift Route exposing the API.
route:
  host: ""
  labels: {}
  annotations: {}

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 512Mi

# Default-deny NetworkPolicies isolating workload pods from each other and other
# namespaces. Verify namespace names + CIDRs match your cluster.
networkPolicy:
  enabled: true
  # Namespaces allowed to connect TO workload pods.
  ingressNamespaces:
    - knative-serving # activator (scale-from-zero)
    - knative-serving-ingress # Kourier ingress gateway
    - openshift-ingress # OpenShift router (Routes)
    - openshift-monitoring # Prometheus scrape
  # Namespaces workload pods may connect TO (the API namespace is always added).
  egressNamespaces:
    - knative-serving # autoscaler / webhook
  dnsNamespace: openshift-dns
  # Off-cluster egress (LBs/Routes/external); internal CIDRs excluded so pods
  # can't reach other pods/Services directly. Set to YOUR cluster's CIDRs.
  externalEgress:
    cidr: 0.0.0.0/0
    exceptCIDRs:
      - 10.128.0.0/14 # pod network
      - 172.30.0.0/16 # service network
