# Turns on everything the default values leave off, so CI renders the paths a
# default install never reaches. Not a recommended configuration - a maximal
# one: a template that only breaks when the SCC binding or the tenant controller token
# is enabled would otherwise reach a cluster before it reaches a reviewer.
build:
  enabled: true
  scc:
    enabled: true
  # A distinct kpack registry, so CI renders its pull-credential paths - the
  # ServiceAccount entries and the tenant template set's ExternalSecret.
  kpackRegistry:
    url: registry.kpack.internal
tenantNamespaces:
  labels:
    pod-security.kubernetes.io/enforce: restricted
  controller:
    enabled: true
    tokenSecret:
      create: true
networkPolicy:
  enabled: true
  build:
    enabled: true
    egressNamespaces:
      - internal-registry
    egressCIDRs:
      - 10.9.0.0/24
