# External exposure for the API itself. The serverless-api.{base_domain} DNS
# record fronts the active instance across both clusters (docs §2/§4).
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespaces.api }}
  labels:
    {{- include "serverless-api.labels" . | nindent 4 }}
    {{- with .Values.route.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.route.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  host: {{ tpl (.Values.route.host | default (printf "serverless.%s" .Values.global.baseDomain)) . | quote }}
  to:
    kind: Service
    name:  {{ .Values.name }}
  port:
    targetPort: {{ .Values.service.portName }}
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
