{{- with .Values.registry.apiTokens }}
{{- if .create }}
# The Quay OAuth token for EVERY region's registry, in one variable.
#
# Its own template rather than an entry in `externalSecrets.secrets`: that list is
# a fixed name -> Vault property projection, and this is keyed by `regions`, needs a
# `target.template` to assemble one value out of many, and fails in a way none of
# the others can (below). docs/BUILDING.md - Registry cleanup on delete.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .secretName }}
  namespace: {{ $.Values.namespaces.api }}
  labels:
    {{- include "serverless-api.labels" $ | nindent 4 }}
spec:
  refreshInterval: {{ .refreshInterval | default $.Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ $.Values.externalSecrets.clusterSecretStore }}
    kind: ClusterSecretStore
  target:
    name: {{ .secretName }}
    # A delete reclaims repositories in ALL regions from whichever instance took the
    # request, so every pod needs every region's token. `index` because a region name
    # may contain '-', which is not a legal Go template field reference.
    template:
      data:
        SERVERLESS_REGION_REGISTRY_TOKENS: {{ include "serverless-api.regionTokensTemplate" $ | quote }}
  data:
    {{- range $.Values.regions }}
    - secretKey: {{ .name }}
      remoteRef:
        key: {{ tpl (replace "{region}" .name $.Values.registry.apiTokens.key) $ }}
        property: {{ $.Values.registry.apiTokens.property }}
    {{- end }}
{{- end }}
{{- end }}
