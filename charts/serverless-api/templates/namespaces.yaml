# The API's own namespace - the one namespace this chart creates directly.
# Workload namespaces are per group ({group}{tenantNamespaces.suffix}),
# provisioned at runtime by the tenant controller from the tenant template set.
# Guarded with ArgoCD sync-options so it is never pruned or deleted when the
# Application is synced or removed.
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespaces.api }}
  labels:
    {{- include "serverless-api.namespaceLabels" (dict "root" $ "extra" (.Values.namespaces.apiLabels | default dict)) | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
