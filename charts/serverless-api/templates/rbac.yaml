# Least-privilege RBAC for the client-cert user (CN = DNS name), split across the
# two namespaces it works in: tenant resources here, build resources in the API
# namespace (second Role below). docs §6.3 / §12.4
#
# Routes are NOT in this Role: on OpenShift Serverless the operator auto-creates
# the OpenShift Route from the KSVC/DomainMapping, so the API never creates Routes.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespaces.workloads }}
  labels:
    {{- include "serverless-api.labels" . | nindent 4 }}
rules:
  - apiGroups: ["serving.knative.dev"]
    resources: ["services", "domainmappings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Revisions are read-only: GET reports actualReplicas (live scale) from them.
  - apiGroups: ["serving.knative.dev"]
    resources: ["revisions"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list", "watch"]
  # Read pod logs for the /logs endpoint (a subresource, separate from pods).
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # Live per-site resource usage surfaced on GET.
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespaces.workloads }}
  labels:
    {{- include "serverless-api.labels" . | nindent 4 }}
subjects:
  - kind: User
    name: {{ .Values.certificate.user }}
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: {{ .Values.name }}
  apiGroup: rbac.authorization.k8s.io
{{- if .Values.build.enabled }}
---
# A SECOND Role, in the API namespace, for the build resources only. Builds live
# there rather than beside the tenant functions (§2), and RBAC follows them: the
# client-cert user gets kpack rights here and none in the workloads namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.name }}-build
  namespace: {{ .Values.namespaces.api }}
  labels:
    {{- include "serverless-api.labels" . | nindent 4 }}
rules:
  # Function image builds. The API server-side applies one Image per function
  # (create/update on POST/PUT/webhook); the build service watches it for
  # status.latestImage. docs/BUILD-PIPELINE.md §8 / §12.
  - apiGroups: ["kpack.io"]
    resources: ["images"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Builds are read-only: GET reports build state before falling through to the
  # KSVC status (§10), and their pods carry the per-phase build logs.
  - apiGroups: ["kpack.io"]
    resources: ["builds"]
    verbs: ["get", "list", "watch"]
  # Build pods and their logs, for the build half of the /logs endpoint. Read
  # only - the API never creates a build pod, kpack does.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # Each function builds under its OWN ServiceAccount, pairing that function's
  # caller-supplied git token with the shared registry credential, so one
  # tenant's build cannot read another's token. The API creates both, so the
  # git Secret has to live in this namespace too - kpack resolves a build's
  # credentials from the ServiceAccount in the Image's own namespace. (§6)
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  # WRITE ONLY, deliberately: no `get`, no `list`. This namespace also holds the
  # platform's own credentials - the registry pull/push secret and everything
  # else ESO projects for the API - and a read verb here would expose all of
  # them to the client-cert user. Writing a per-function git Secret needs
  # `create` and `patch` (server-side apply is a PATCH, not a read-modify-write)
  # and cleanup needs `delete`; none of them need to read anything back.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.name }}-build
  namespace: {{ .Values.namespaces.api }}
  labels:
    {{- include "serverless-api.labels" . | nindent 4 }}
subjects:
  - kind: User
    name: {{ .Values.certificate.user }}
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: {{ .Values.name }}-build
  apiGroup: rbac.authorization.k8s.io
{{- end }}
