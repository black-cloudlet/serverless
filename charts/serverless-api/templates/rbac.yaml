# Least-privilege RBAC for the client-cert user (CN = DNS name).
# docs/DEPLOYING.md - RBAC.
#
# A ClusterRole holding namespaced rules, bound per tenant namespace by the
# tenant controller's template set. The writes stay namespace-bound - a
# RoleBinding to a ClusterRole grants only inside its own namespace - but the
# *definition* has to be cluster-scoped, because a tenant namespace created at
# runtime cannot carry a copy of it and the tenant controller only writes the
# binding.
#
# Routes are NOT here: on OpenShift Serverless the operator auto-creates the
# OpenShift Route from the KSVC/DomainMapping, so the API never creates Routes.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.name }}
  labels:
    {{- include "serverless-api.labels" . | nindent 4 }}
rules:
  - apiGroups: ["serving.knative.dev"]
    resources: ["services", "domainmappings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Revisions are read-only: GET reports actualReplicas (live scale) from them.
  - apiGroups: ["serving.knative.dev"]
    resources: ["revisions"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list", "watch"]
  # Read pod logs for the /logs endpoint (a subresource, separate from pods).
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # Live per-region resource usage surfaced on GET.
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
  {{- if .Values.build.enabled }}
  # Function image builds. The API applies one Image per function; it is an owned
  # resource of the KSVC, so GC deletes it with the function.
  # docs/BUILDING.md - Lifecycle & Cleanup.
  - apiGroups: ["kpack.io"]
    resources: ["images"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Builds are read, plus one write the API never creates or deletes: an explicit
  # rebuild annotates the latest Build, which is where kpack looks for it
  # (docs/BUILDING.md - What causes a new Build). Reads back the build state for
  # a GET, and their pods carry the per-phase build logs
  # (docs/FUNCTIONS.md - Function Status Resolution).
  - apiGroups: ["kpack.io"]
    resources: ["builds"]
    verbs: ["get", "list", "watch", "patch"]
  # Per-function build account: that function's git Secret + the registry cred
  # (docs/BUILDING.md - Registry & Git Credentials).
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  {{- end }}
---
# Cluster-wide READS, and nothing else. Two callers need them once workloads
# live in one namespace per group: the host-uniqueness pre-flight, which must
# see DomainMappings in every tenant namespace to know a host is free, and the
# build controller's watch, which follows kpack Images wherever they are built.
# Writes are deliberately not here - they stay bound per namespace above.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.name }}-read
  labels:
    {{- include "serverless-api.labels" . | nindent 4 }}
rules:
  - apiGroups: ["serving.knative.dev"]
    resources: ["services", "domainmappings", "revisions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  {{- if .Values.build.enabled }}
  - apiGroups: ["kpack.io"]
    resources: ["images", "builds"]
    verbs: ["get", "list", "watch"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.name }}-read
  labels:
    {{- include "serverless-api.labels" . | nindent 4 }}
subjects:
  - kind: User
    name: {{ .Values.certificate.user }}
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: {{ .Values.name }}-read
  apiGroup: rbac.authorization.k8s.io
