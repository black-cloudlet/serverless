# Least-privilege RBAC for the client-cert user (CN = DNS name), split across the
# two namespaces it works in: tenant resources here, build resources in the API
# namespace (second Role below). docs §6.3 / §12.4
#
# Routes are NOT in this Role: on OpenShift Serverless the operator auto-creates
# the OpenShift Route from the KSVC/DomainMapping, so the API never creates Routes.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespaces.workloads }}
  labels:
    {{- include "serverless-api.labels" . | nindent 4 }}
rules:
  - apiGroups: ["serving.knative.dev"]
    resources: ["services", "domainmappings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Revisions are read-only: GET reports actualReplicas (live scale) from them.
  - apiGroups: ["serving.knative.dev"]
    resources: ["revisions"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list", "watch"]
  # Read pod logs for the /logs endpoint (a subresource, separate from pods).
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # Live per-site resource usage surfaced on GET.
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespaces.workloads }}
  labels:
    {{- include "serverless-api.labels" . | nindent 4 }}
subjects:
  - kind: User
    name: {{ .Values.certificate.user }}
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: {{ .Values.name }}
  apiGroup: rbac.authorization.k8s.io
{{- if .Values.build.enabled }}
---
# Build rights, in the API namespace where builds run (§2.1).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.name }}-build
  namespace: {{ .Values.namespaces.api }}
  labels:
    {{- include "serverless-api.labels" . | nindent 4 }}
rules:
  - apiGroups: ["kpack.io"]
    resources: ["images"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["kpack.io"]
    resources: ["builds"]
    verbs: ["get", "list", "watch"]
  # Build pods and their per-phase logs; kpack creates them, the API only reads.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # Per-function build account: that function's git token + the registry cred (§6).
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  # Write-only on purpose: this namespace holds the platform's own ESO secrets,
  # and writing a git Secret never needs to read one back (SSA is a PATCH).
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.name }}-build
  namespace: {{ .Values.namespaces.api }}
  labels:
    {{- include "serverless-api.labels" . | nindent 4 }}
subjects:
  - kind: User
    name: {{ .Values.certificate.user }}
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: {{ .Values.name }}-build
  apiGroup: rbac.authorization.k8s.io
{{- end }}
