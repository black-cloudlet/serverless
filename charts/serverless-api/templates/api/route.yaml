# External exposure for the API itself. The serverless-api.{base_domain} DNS
# record fronts the active instance across both clusters
# (docs/ARCHITECTURE.md - Networking & Exposure).
{{- include "serverless-api.validateStream" . }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespaces.api }}
  labels:
    {{- include "serverless-api.labels" . | nindent 4 }}
    {{- with .Values.api.route.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    # Held open for the SSE endpoints; the router's 30s default would cut every
    # stream (values.yaml - api.route.timeout). Listed before the user's own
    # annotations so an operator can still override it.
    haproxy.router.openshift.io/timeout: {{ .Values.api.route.timeout | quote }}
    {{- with .Values.api.route.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  host: {{ tpl (.Values.api.route.host | default (printf "serverless.%s" .Values.global.baseDomain)) . | quote }}
  to:
    kind: Service
    name:  {{ .Values.name }}
  port:
    targetPort: {{ .Values.api.service.portName }}
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
