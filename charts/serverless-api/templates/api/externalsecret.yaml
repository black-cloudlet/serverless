# One ExternalSecret per kind of data (separate target Secrets) - referencing the
# PRE-EXISTING ClusterSecretStore. We do NOT ship a SecretStore.
# docs/ARCHITECTURE.md - Secrets Management.
# Every listed Secret is also loaded into the API via the Deployment's envFrom.
# The per-region registry tokens are NOT here: they are keyed by `regions` rather than
# by a fixed list, so they have their own template (registry-tokens.yaml).
{{- range .Values.externalSecrets.secrets }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .name }}
  namespace: {{ $.Values.namespaces.api }}
  labels:
    {{- include "serverless-api.labels" $ | nindent 4 }}
spec:
  refreshInterval: {{ .refreshInterval | default $.Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ $.Values.externalSecrets.clusterSecretStore }}
    kind: ClusterSecretStore
  target:
    name: {{ .name }}
  data:
    {{- range .data }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ .key }}
        property: {{ .property }}
    {{- end }}
{{- end }}
