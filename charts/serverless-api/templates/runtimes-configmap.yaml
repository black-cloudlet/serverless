# Available function runtimes, mounted as a YAML file into the API. Non-secret,
# so it lives in a ConfigMap; edit the list without touching the Deployment.
# Every field of a runtime entry is serialized, so new per-runtime keys pass
# through with no template change. Each entry's `buildEnv` arrives already merged
# with the shared build env and the dependency mirror (see the helper), so the
# API applies it as-is to a build. docs/BUILD-PIPELINE.md §4.
#
# Credentials must never be placed here - this ConfigMap is readable by anyone
# with ConfigMap read in the namespace. Use a binding instead (§14.4).
apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ .Values.name }}-runtimes"
  namespace: {{ .Values.namespaces.api }}
  labels:
    {{- include "serverless-api.labels" . | nindent 4 }}
data:
  runtimes.yaml: |
    {{- include "serverless-api.resolvedRuntimes" . | nindent 4 }}
