apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespaces.api }}
  labels:
    {{- include "serverless-api.labels" . | nindent 4 }}
    {{- with .Values.api.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.api.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  # The two identity labels only: a selector is immutable once it exists.
  selector:
    matchLabels:
      {{- include "serverless-api.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "serverless-api.labels" . | nindent 8 }}
        {{- with .Values.api.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.api.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      containers:
        - name: {{ .Values.name }}
          image: {{ include "serverless-api.image" (dict "root" $ "spec" .Values.api) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.api.service.targetPort }}
          env:
            - name: SERVERLESS_PORT
              value: {{ .Values.api.service.targetPort | quote }}
            - name: SERVERLESS_AUTH_ENABLED
              value: "true"
            - name: SERVERLESS_BASE_DOMAIN
              value: {{ .Values.global.baseDomain | quote }}
            - name: SERVERLESS_LOCAL_REGION
              value: {{ .Values.global.region | quote }}
            - name: SERVERLESS_ROUTE_DOMAIN
              value: {{ tpl .Values.routeDomain . | quote }}
            - name: SERVERLESS_WORKLOADS_NAMESPACE
              value: {{ .Values.namespaces.workloads | quote }}
            - name: SERVERLESS_CORS_ALLOW_ORIGINS
              {{- /* Each entry is templated, then JSON-encoded - tpl on the
                     encoded list instead would put rendered text inside JSON
                     without escaping it. */}}
              {{- $origins := list }}
              {{- range .Values.corsAllowOrigins }}
              {{- $origins = append $origins (tpl . $) }}
              {{- end }}
              value: {{ toJson $origins | quote }}
            - name: SERVERLESS_STREAM__MAX_CONCURRENT
              value: {{ .Values.stream.maxConcurrent | quote }}
            - name: SERVERLESS_STREAM__INTERVAL_SECONDS
              value: {{ .Values.stream.intervalSeconds | quote }}
            - name: SERVERLESS_STREAM__MIN_INTERVAL_SECONDS
              value: {{ .Values.stream.minIntervalSeconds | quote }}
            - name: SERVERLESS_STREAM__MAX_INTERVAL_SECONDS
              value: {{ .Values.stream.maxIntervalSeconds | quote }}
            - name: SERVERLESS_STREAM__HEARTBEAT_SECONDS
              value: {{ .Values.stream.heartbeatSeconds | quote }}
            - name: SERVERLESS_STREAM__QUEUE_SIZE
              value: {{ .Values.stream.queueSize | quote }}
            - name: SERVERLESS_STREAM__QUEUE_MAX_BYTES
              value: {{ .Values.stream.queueMaxBytes | quote }}
            - name: SERVERLESS_STREAM__MAX_SECONDS
              value: {{ .Values.stream.maxSeconds | quote }}
            - name: SERVERLESS_STREAM__TICKET_TTL_SECONDS
              value: {{ .Values.stream.ticketTtlSeconds | quote }}
            - name: SERVERLESS_STREAM__SNAPSHOT_TAIL_LINES
              value: {{ .Values.stream.snapshotTailLines | quote }}
            - name: SERVERLESS_STREAM__SNAPSHOT_MAX_BYTES
              value: {{ .Values.stream.snapshotMaxBytes | quote }}
            - name: SERVERLESS_REGISTRY__URL
              value: {{ .Values.registry.url | quote }}
            - name: SERVERLESS_REGISTRY__DELETE_ON_FUNCTION_DELETE
              value: {{ .Values.registry.deleteOnFunctionDelete | quote }}
            - name: SERVERLESS_REGISTRY__ORGANIZATION
              value: {{ .Values.registry.organization | quote }}
            # The Builders' repository is the functions' too, so both sit under
            # one root (docs/BUILDING.md - Registry layout). Outside the
            # build.enabled guard below: it also addresses the repository a
            # deleted function's cleanup removes.
            - name: SERVERLESS_REGISTRY__REPOSITORY
              value: {{ tpl .Values.build.builderRepository . | quote }}
            - name: SERVERLESS_SSO__ISSUER
              value: {{ tpl .Values.sso.issuer . | quote }}
            - name: SERVERLESS_SSO__AUDIENCE
              value: {{ .Values.sso.audience | quote }}
            - name: SERVERLESS_SSO__SWAGGER_CLIENT_ID
              value: {{ .Values.sso.swaggerClientId | quote }}
            - name: SERVERLESS_SSO__GROUPS_CLAIM
              value: {{ .Values.sso.groupsClaim | quote }}
            - name: SERVERLESS_SSO__ADMIN_GROUPS
              value: {{ toJson .Values.sso.adminGroups | quote }}
            - name: SERVERLESS_CLIENT_CERT_DIR
              value: {{ .Values.certificate.mountPath | quote }}
            - name: SERVERLESS_CA_BUNDLE__CONFIG_MAP
              value: {{ .Values.caBundle.name | quote }}
            - name: SERVERLESS_CA_BUNDLE__KEY
              value: {{ .Values.caBundle.key | quote }}
            - name: SERVERLESS_CA_BUNDLE__MOUNT_PATH
              value: {{ .Values.caBundle.mountPath | quote }}
            - name: SERVERLESS_RUNTIMES_FILE
              value: {{ printf "%s/runtimes.yaml" .Values.runtimesMountPath | quote }}
            {{- if .Values.build.enabled }}
            - name: SERVERLESS_BUILD__REGISTRY_SECRET
              value: {{ .Values.build.serviceAccount.registrySecret.name | quote }}
            {{- with .Values.build.kpackRegistry }}
            {{- if and .url .pullSecret.name }}
            - name: SERVERLESS_BUILD__KPACK_REGISTRY_SECRET
              value: {{ .pullSecret.name | quote }}
            {{- end }}
            {{- end }}
            - name: SERVERLESS_BUILD__GIT_USERNAME
              value: {{ .Values.build.gitUsername | quote }}
            - name: SERVERLESS_BUILD__RESOURCES
              value: {{ .Values.build.resources | toJson | quote }}
            - name: SERVERLESS_BUILD__CACHE
              value: {{ .Values.build.cache | quote }}
            - name: SERVERLESS_BUILD__SUCCESS_HISTORY_LIMIT
              value: {{ .Values.build.history.success | quote }}
            - name: SERVERLESS_BUILD__FAILED_HISTORY_LIMIT
              value: {{ .Values.build.history.failed | quote }}
            {{- end }}
            - name: SSL_CERT_FILE
              value: {{ printf "%s/%s" .Values.caBundle.mountPath .Values.caBundle.key | quote }}
            - name: REQUESTS_CA_BUNDLE
              value: {{ printf "%s/%s" .Values.caBundle.mountPath .Values.caBundle.key | quote }}
          envFrom:
            # Non-secret regions list (SERVERLESS_REGIONS); edited without touching
            # the Deployment.
            - configMapRef:
                name: "{{ .Values.name }}-regions"
            {{- range .Values.externalSecrets.secrets }}
            - secretRef:
                name: {{ .name }}
            {{- end }}
            {{- with .Values.registry.apiTokens }}
            {{- if .create }}
            - secretRef:
                name: {{ .secretName }}
                # ESO fails the WHOLE ExternalSecret if any one region's Vault path
                # is missing, and `regions` is shared - so a region added before its
                # entry exists would otherwise stop this pod starting in every
                # cluster. Absent, registry cleanup is skipped, which is what it
                # already does untokenised.
                optional: true
            {{- end }}
            {{- end }}
          volumeMounts:
            - name: {{ .Values.certificate.name }}
              mountPath: {{ .Values.certificate.mountPath }}
              readOnly: true
            - name: {{ .Values.caBundle.name }}
              mountPath: {{ .Values.caBundle.mountPath }}
              readOnly: true
            - name: runtimes
              mountPath: {{ .Values.runtimesMountPath }}
              readOnly: true
          # Explicit timings, because the probe endpoints share one event loop
          # with the SSE streams: under streaming load a response can take
          # longer than the kubelet's 1s default timeout, and with the default
          # thresholds that flapped the pod unready and then restarted it.
          # Constant-response endpoints answering slowly means "busy", which
          # readiness should reflect eventually (three misses, not one) and
          # liveness should tolerate far longer before killing open streams.
          #
          # Until this passes, neither probe below runs - so a slow cold start
          # (OIDC discovery and per-region connects time out one by one when a
          # dependency is down) is "still starting", not six liveness strikes
          # against a socket that is not open yet.
          startupProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.api.service.targetPort }}
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ .Values.api.service.targetPort }}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # 18, not 6: readiness already sheds traffic at ~30s, which is the
          # remedy for a busy loop - killing the pod is not. A restart here cuts
          # every open stream, whose clients reconnect within seconds onto the
          # other replica and push the same load there: with the two thresholds
          # close together that cascaded, taking the replicas down in turn.
          # Liveness is for a wedged process, and a wedged process is still
          # wedged three minutes later.
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.api.service.targetPort }}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 18
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      volumes:
        - name: {{ .Values.certificate.name }}
          secret:
            secretName: {{ .Values.certificate.name }}
        - name: {{ .Values.caBundle.name }}
          configMap:
            name: {{ .Values.caBundle.name }}
        - name: runtimes
          configMap:
            name: "{{ .Values.name }}-runtimes"
