apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespaces.api }}
  labels:
    {{- include "serverless-api.labels" . | nindent 4 }}
    {{- with .Values.deployment.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.deployment.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "serverless-api.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "serverless-api.labels" . | nindent 8 }}
        {{- with .Values.deployment.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.deployment.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      containers:
        - name: {{ .Values.name }}
          image: {{ include "serverless-api.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
          env:
            - name: SERVERLESS_PORT
              value: {{ .Values.service.targetPort | quote }}
            - name: SERVERLESS_AUTH_ENABLED
              value: "true"
            - name: SERVERLESS_BASE_DOMAIN
              value: {{ .Values.global.baseDomain | quote }}
            - name: SERVERLESS_LOCAL_SITE
              value: {{ .Values.global.site | quote }}
            - name: SERVERLESS_ROUTE_DOMAIN
              value: {{ tpl .Values.routeDomain . | quote }}
            - name: SERVERLESS_WORKLOADS_NAMESPACE
              value: {{ .Values.namespaces.workloads | quote }}
            - name: SERVERLESS_CORS_ALLOW_ORIGINS
              value: {{ toJson .Values.corsAllowOrigins | quote }}
            - name: SERVERLESS_REGISTRY__URL
              value: {{ .Values.registry.url | quote }}
            - name: SERVERLESS_REGISTRY__DELETE_ON_FUNCTION_DELETE
              value: {{ .Values.registry.deleteOnFunctionDelete | quote }}
            - name: SERVERLESS_REGISTRY__ORGANIZATION
              value: {{ .Values.registry.organization | quote }}
            - name: SERVERLESS_SSO__ISSUER
              value: {{ .Values.sso.issuer | quote }}
            - name: SERVERLESS_SSO__AUDIENCE
              value: {{ .Values.sso.audience | quote }}
            - name: SERVERLESS_SSO__SWAGGER_CLIENT_ID
              value: {{ .Values.sso.swaggerClientId | quote }}
            - name: SERVERLESS_SSO__GROUPS_CLAIM
              value: {{ .Values.sso.groupsClaim | quote }}
            - name: SERVERLESS_SSO__ADMIN_GROUPS
              value: {{ toJson .Values.sso.adminGroups | quote }}
            - name: SERVERLESS_CLIENT_CERT_DIR
              value: {{ .Values.certificate.mountPath | quote }}
            - name: SERVERLESS_CA_BUNDLE__CONFIG_MAP
              value: {{ .Values.caBundle.name | quote }}
            - name: SERVERLESS_CA_BUNDLE__KEY
              value: {{ .Values.caBundle.key | quote }}
            - name: SERVERLESS_CA_BUNDLE__MOUNT_PATH
              value: {{ .Values.caBundle.mountPath | quote }}
            - name: SERVERLESS_RUNTIMES_FILE
              value: {{ printf "%s/runtimes.yaml" .Values.runtimesMountPath | quote }}
            {{- if .Values.build.enabled }}
            - name: SERVERLESS_BUILD__REGISTRY_SECRET
              value: {{ .Values.build.serviceAccount.registrySecret.name | quote }}
            - name: SERVERLESS_BUILD__GIT_USERNAME
              value: {{ .Values.build.gitUsername | quote }}
            - name: SERVERLESS_BUILD__RESOURCES
              value: {{ .Values.build.resources | toJson | quote }}
            - name: SERVERLESS_BUILD__CACHE
              value: {{ .Values.build.cache | quote }}
            {{- end }}
            - name: SSL_CERT_FILE
              value: {{ printf "%s/%s" .Values.caBundle.mountPath .Values.caBundle.key | quote }}
            - name: REQUESTS_CA_BUNDLE
              value: {{ printf "%s/%s" .Values.caBundle.mountPath .Values.caBundle.key | quote }}
          envFrom:
            # Non-secret sites list (SERVERLESS_SITES); edited without touching
            # the Deployment.
            - configMapRef:
                name: "{{ .Values.name }}-sites"
            {{- range .Values.externalSecrets.secrets }}
            - secretRef:
                name: {{ .name }}
            {{- end }}
          volumeMounts:
            - name: {{ .Values.certificate.name }}
              mountPath: {{ .Values.certificate.mountPath }}
              readOnly: true
            - name: {{ .Values.caBundle.name }}
              mountPath: {{ .Values.caBundle.mountPath }}
              readOnly: true
            - name: runtimes
              mountPath: {{ .Values.runtimesMountPath }}
              readOnly: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ .Values.service.targetPort }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.service.targetPort }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: {{ .Values.certificate.name }}
          secret:
            secretName: {{ .Values.certificate.name }}
        - name: {{ .Values.caBundle.name }}
          configMap:
            name: {{ .Values.caBundle.name }}
        - name: runtimes
          configMap:
            name: "{{ .Values.name }}-runtimes"
