# Trusted CA bundle, auto-populated by OpenShift via the inject-trusted-cabundle
# label, and mounted into the API so it trusts internal TLS (git, registry,
# Vault, SSO, the cluster API). Each tenant namespace gets its own copy from
# the tenant template set.
#
# OpenShift writes the bundle into .data, so configure the ArgoCD Application
# (separate GitOps repo) to ignoreDifferences on this ConfigMap's data.
{{ include "serverless-api.caBundleConfigMap" (dict "root" $ "namespace" .Values.namespaces.api) }}
