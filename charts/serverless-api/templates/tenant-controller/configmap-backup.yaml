{{- if and .Values.tenantNamespaces.controller.enabled .Values.backup.enabled }}
{{- include "serverless-api.validateBackup" . }}
{{- $ns := include "serverless-api.tenantNamespaceToken" . }}
{{- $region := include "serverless-api.tenantRegionToken" . }}
{{- $app := printf "%s-%s" $ns $region }}
{{- $appVault := include "serverless-api.tenantRegionalValue" (dict "root" $ "key" .Values.backup.appVault.name) }}
{{/*
Part of the tenant template set: the namespace's backups, through Trident
Protect (docs/TENANT-CONTROLLER.md - Backups).

Argo syncs these ConfigMaps; the controller mounts them projected into one
directory, hashes the whole set, and applies it into each {group}{suffix}
namespace with the tokens substituted - which is how a `helm upgrade` reaches
namespaces created at runtime, that Argo cannot see.

NOTHING IN THE SET MAY DEPEND ON THE REGION. Both regions render this chart from
the same values, so both hold identical bytes and the same hash, and a provision
converges a peer's namespace from whichever controller took the request. Both
per-region facts here go in as the region token: the application's name, and the
AppVault it is written to.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "serverless-api.tenantTemplatesName" (dict "root" $ "part" "backup") }}
  namespace: {{ .Values.namespaces.api }}
  labels:
    {{- include "serverless-api.labels" . | nindent 4 }}
data:
  # The namespace is the application: an empty `labelSelector` protects
  # everything in it, where selecting by label would silently drop whatever a
  # later release adds without that label. The region is in the name because
  # the same namespace exists in both clusters and is backed up in both.
  80-backup-application.yaml: |
    apiVersion: protect.trident.netapp.io/v1
    kind: Application
    metadata:
      name: {{ $app }}
      namespace: {{ $ns }}
    spec:
      includedNamespaces:
        - namespace: {{ $ns }}
          labelSelector: {}
  # One Schedule per `backup.schedules` entry, retention per schedule so the
  # hourly copies expire without touching the weekly one. The AppVault is NOT
  # created here: it holds the object-store credentials and is declared once per
  # cluster in the `trident-protect` namespace, referenced from here by name.
  85-backup-schedules.yaml: |
{{- range $i, $schedule := .Values.backup.schedules }}
{{- if $i }}
    ---
{{- end }}
    apiVersion: protect.trident.netapp.io/v1
    kind: Schedule
    metadata:
      name: {{ printf "%s-%s" $app $schedule.name }}
      namespace: {{ $ns }}
    spec:
      applicationRef: {{ $app }}
      appVaultRef: {{ $appVault }}
      granularity: {{ $schedule.granularity }}
      backupRetention: {{ $schedule.backupRetention | quote }}
      snapshotRetention: {{ default $.Values.backup.snapshotRetention $schedule.snapshotRetention | quote }}
{{- with (default $.Values.backup.dataMover $schedule.dataMover) }}
      dataMover: {{ . }}
{{- end }}
{{- if hasKey $schedule "minute" }}
      minute: {{ $schedule.minute | quote }}
{{- end }}
{{- if hasKey $schedule "hour" }}
      hour: {{ $schedule.hour | quote }}
{{- end }}
{{- if hasKey $schedule "dayOfWeek" }}
      dayOfWeek: {{ $schedule.dayOfWeek | quote }}
{{- end }}
{{- if hasKey $schedule "dayOfMonth" }}
      dayOfMonth: {{ $schedule.dayOfMonth | quote }}
{{- end }}
{{- end }}
{{- end }}
