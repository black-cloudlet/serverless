{{- $ns := include "serverless-api.tenantNamespaceToken" . }}
{{/*
Part of the tenant template set: the API's grant inside a tenant namespace.

Argo syncs these ConfigMaps; the controller mounts them projected into one
directory, hashes the whole set, and applies it into each {group}{suffix}
namespace with the tokens substituted - which is how a `helm upgrade` reaches
namespaces created at runtime, that Argo cannot see.

NOTHING IN THE SET MAY DEPEND ON THE REGION. Both regions render this chart from
the same values, so both hold identical bytes and the same hash, and a provision
converges a peer's namespace from whichever controller took the request. A
per-region value goes in as a token the controller resolves against the cluster
it is writing to - never baked in here.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "serverless-api.tenantTemplatesName" (dict "root" $ "part" "rbac") }}
  namespace: {{ .Values.namespaces.api }}
  labels:
    {{- include "serverless-api.labels" . | nindent 4 }}
data:
  # The API's client-cert user, granted the same namespaced rules it holds in
  # the legacy namespace. The ClusterRole is the definition; this is the grant,
  # and a RoleBinding to a ClusterRole reaches only into its own namespace -
  # which is the point. A ClusterRoleBinding would hand those verbs to the API
  # in kube-system and every other namespace in the cluster.
  40-rbac.yaml: |
    apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata:
      name: {{ .Values.name }}
      namespace: {{ $ns }}
    subjects:
      - kind: User
        name: {{ .Values.certificate.user }}
        apiGroup: rbac.authorization.k8s.io
    roleRef:
      kind: ClusterRole
      name: {{ .Values.name }}
      apiGroup: rbac.authorization.k8s.io
