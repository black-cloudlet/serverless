{{- if and .Values.tenantNamespaces.controller.enabled .Values.networkPolicy.enabled }}
{{- $ns := include "serverless-api.tenantNamespaceToken" . }}
{{/*
Part of the tenant template set: the namespace's segmentation.

Argo syncs these ConfigMaps; the controller mounts them projected into one
directory, hashes the whole set, and applies it into each {group}{suffix}
namespace with the tokens substituted - which is how a `helm upgrade` reaches
namespaces created at runtime, that Argo cannot see.

NOTHING IN THE SET MAY DEPEND ON THE REGION. Both regions render this chart from
the same values, so both hold identical bytes and the same hash, and a provision
converges a peer's namespace from whichever controller took the request. A
per-region value goes in as a token the controller resolves against the cluster
it is writing to - never baked in here.
*/}}
{{/*
The bodies come from _network-policies.tpl at the chart root.

Rendered only when `networkPolicy.enabled`. Turning it off drops this part from
the set, and the controller prunes the policies it had applied out of every
tenant namespace - `NetworkPolicy` is one of the kinds it owns there. The
tenant controller's own policy is not this switch's to turn off: it is rendered
unconditionally beside the Deployment.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "serverless-api.tenantTemplatesName" (dict "root" $ "part" "network-policies") }}
  namespace: {{ .Values.namespaces.api }}
  labels:
    {{- include "serverless-api.labels" . | nindent 4 }}
data:
  20-network-policies.yaml: |
    {{- include "serverless-api.workloadNetworkPolicies" (dict "root" $ "namespace" $ns) | nindent 4 }}
{{- end }}
