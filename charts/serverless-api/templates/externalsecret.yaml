# One ExternalSecret per kind of data (separate target Secrets) - referencing the
# PRE-EXISTING ClusterSecretStore. We do NOT ship a SecretStore.
# docs/ARCHITECTURE.md - Secrets Management.
# Every listed Secret is also loaded into the API via the Deployment's envFrom.
{{- range .Values.externalSecrets.secrets }}
{{- $perSite := .perSiteRegistryTokens }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .name }}
  namespace: {{ $.Values.namespaces.api }}
  labels:
    {{- include "serverless-api.labels" $ | nindent 4 }}
spec:
  refreshInterval: {{ .refreshInterval | default $.Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ $.Values.externalSecrets.clusterSecretStore }}
    kind: ClusterSecretStore
  target:
    name: {{ .name }}
    {{- if $perSite }}
    # Every site's token in one variable: a delete reclaims repositories in ALL
    # sites from whichever instance took the request, so each pod needs each
    # site's. `index` because a site name may contain '-', which is not a legal
    # Go template field reference.
    template:
      data:
        SERVERLESS_SITE_REGISTRY_TOKENS: {{ include "serverless-api.siteTokensTemplate" $ | quote }}
    {{- end }}
  data:
    {{- range .data }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ .key }}
        property: {{ .property }}
    {{- end }}
    {{- if $perSite }}
    {{- range $.Values.sites }}
    - secretKey: {{ .name }}
      remoteRef:
        key: {{ tpl (replace "{site}" .name $perSite.key) $ }}
        property: {{ $perSite.property }}
    {{- end }}
    {{- end }}
{{- end }}
