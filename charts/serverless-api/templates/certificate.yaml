# The identity the API and the build controller share (docs/DEPLOYING.md - RBAC).
# The tenant controller has its own, in tenant-controller/certificate.yaml.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.certificate.name }}
  namespace: {{ .Values.namespaces.api }}
  labels:
    {{- include "serverless-api.labels" . | nindent 4 }}
spec:
  secretName: {{ .Values.certificate.name }}
  commonName: {{ .Values.certificate.user }}
  dnsNames:
    - {{  .Values.certificate.user }}
  issuerRef:
    name: {{ .Values.certificate.issuerRef.name }}
    kind: {{ .Values.certificate.issuerRef.kind }}
  privateKey:
    algorithm: RSA
    encoding: PKCS1
    rotationPolicy: Always
    size: 4096
