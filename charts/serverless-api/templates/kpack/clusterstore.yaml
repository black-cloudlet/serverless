{{- if and .Values.build.enabled .Values.build.store.create }}
# Cluster-scoped singleton (see values.yaml). Must provide every id used in a
# builder order - a missing id leaves that Builder permanently not-Ready.
# Bumping a source is what triggers kpack's BUILDPACK rebuilds. (§3 / §7)
apiVersion: kpack.io/v1alpha2
kind: ClusterStore
metadata:
  name: {{ .Values.build.store.name }}
  labels:
    {{- include "serverless-api.labels" . | nindent 4 }}
spec:
  sources:
    {{- range .Values.build.store.sources }}
    - image: {{ include "serverless-api.buildpackImage" (dict "root" $ "img" .) | quote }}
    {{- end }}
  # Credentials for pulling the buildpackages from the internal mirror.
  serviceAccountRef:
    name: {{ .Values.build.serviceAccount.name }}
    namespace: {{ .Values.namespaces.workloads }}
{{- end }}
