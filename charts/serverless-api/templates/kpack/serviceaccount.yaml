{{- if .Values.build.enabled }}
{{- include "serverless-api.validateBuild" . }}
# ClusterBuilders only. No git credential: composing a builder image never
# clones source. In the API namespace because a ClusterBuilder's
# serviceAccountRef needs one fixed home, and tenant namespaces are made at
# runtime. Function builds use a per-function SA the API creates in the
# workload's own namespace (docs/BUILDING.md - Registry & Git Credentials).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.build.serviceAccount.name }}
  namespace: {{ .Values.namespaces.api }}
  labels:
    {{- include "serverless-api.labels" . | nindent 4 }}
# `secrets` is kpack's registry auth; `imagePullSecrets` is kept in step with
# it. Both carry the kpack registry too: composing a builder pulls the stack
# and store from it (docs/BUILDING.md - Registry & Git Credentials).
{{- $creds := list .Values.build.serviceAccount.registrySecret.name }}
{{- with .Values.build.kpackRegistry }}
{{- if and .url .pullSecret.name }}
{{- $creds = append $creds .pullSecret.name }}
{{- end }}
{{- end }}
secrets:
  {{- range $creds }}
  - name: {{ . }}
  {{- end }}
imagePullSecrets:
  {{- range $creds }}
  - name: {{ . }}
  {{- end }}
{{- end }}
