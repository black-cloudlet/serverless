{{- if .Values.build.enabled }}
{{- include "serverless-api.validateBuild" . }}
# The identity every kpack build runs as, in the workloads namespace.
#
# kpack reads the two secret lists differently, so the registry credential is in
# BOTH: `secrets` is the registry auth used to PUSH the built image (and to pull
# the stack/store images), while `imagePullSecrets` is what the build POD uses to
# pull the composed builder image. docs/BUILD-PIPELINE.md §6.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.build.serviceAccount.name }}
  namespace: {{ .Values.namespaces.workloads }}
  labels:
    {{- include "serverless-api.labels" . | nindent 4 }}
secrets:
  - name: {{ .Values.build.serviceAccount.registrySecret.name }}
  - name: {{ .Values.build.serviceAccount.gitSecret.name }}
imagePullSecrets:
  - name: {{ .Values.build.serviceAccount.registrySecret.name }}
{{- end }}
