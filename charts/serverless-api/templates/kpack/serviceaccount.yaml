{{- if .Values.build.enabled }}
{{- include "serverless-api.validateBuild" . }}
# The identity the BUILDERS run as, in the workloads namespace.
#
# A Builder composes a builder image from the ClusterStack and ClusterStore and
# pushes it - it never clones source, so no git credential belongs here.
#
# Function builds use a DIFFERENT, per-function ServiceAccount that the API
# creates, because each function's git token is supplied by its own caller and
# must not be readable by another tenant's build. That account pairs the
# function's `{workload}-git` Secret with the shared registry credential below.
# docs/BUILD-PIPELINE.md §6.
#
# kpack reads the two secret lists differently, so the registry credential is in
# BOTH: `secrets` is the registry auth used to PUSH the composed image (and to
# pull the stack/store images), while `imagePullSecrets` is what the build POD
# uses to pull images.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.build.serviceAccount.name }}
  namespace: {{ .Values.namespaces.workloads }}
  labels:
    {{- include "serverless-api.labels" . | nindent 4 }}
secrets:
  - name: {{ .Values.build.serviceAccount.registrySecret.name }}
imagePullSecrets:
  - name: {{ .Values.build.serviceAccount.registrySecret.name }}
{{- end }}
