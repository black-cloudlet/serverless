{{- if .Values.build.enabled }}
{{- include "serverless-api.validateBuild" . }}
# Builders only. No git credential: a Builder pushes a builder image, it never
# clones source. Function builds use a per-function SA the API creates
# (docs/BUILDING.md - Registry & Git Credentials).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.build.serviceAccount.name }}
  namespace: {{ .Values.namespaces.workloads }}
  labels:
    {{- include "serverless-api.labels" . | nindent 4 }}
# `secrets` is kpack's registry auth; `imagePullSecrets` is the build pod's. Both
# carry the kpack registry too: composing a Builder pulls the stack and store
# from it (docs/BUILDING.md - Registry & Git Credentials).
{{- $creds := list .Values.build.serviceAccount.registrySecret.name }}
{{- with .Values.build.kpackRegistry }}
{{- if and .url .pullSecret.name }}
{{- $creds = append $creds .pullSecret.name }}
{{- end }}
{{- end }}
secrets:
  {{- range $creds }}
  - name: {{ . }}
  {{- end }}
imagePullSecrets:
  {{- range $creds }}
  - name: {{ . }}
  {{- end }}
{{- end }}
