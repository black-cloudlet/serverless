{{- if and .Values.build.enabled .Values.build.scc.enabled }}
{{- $scc := .Values.build.scc }}
# A custom SCC gets no generated `system:openshift:scc:*` ClusterRole, so it
# needs its own. The per-tenant RoleBinding granting it - to the namespace's
# whole ServiceAccount group, since the per-function build accounts are named
# at request time - comes from the tenant template set.
# docs/DEPLOYING.md - OpenShift SCC for builds.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.name }}-use-{{ $scc.name }}
  labels:
    {{- include "serverless-api.labels" . | nindent 4 }}
rules:
  - apiGroups: ["security.openshift.io"]
    resources: ["securitycontextconstraints"]
    resourceNames: [{{ $scc.name | quote }}]
    verbs: ["use"]
{{- end }}
