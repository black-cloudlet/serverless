{{- if .Values.build.enabled }}
{{- $registry := .Values.build.serviceAccount.registrySecret }}
# The registry credential, sourced from the PRE-EXISTING ClusterSecretStore like
# every other platform secret (docs §7.1 / §12.5). A dockerconfigjson, used to
# PUSH the built image and, on the KSVC, to PULL it at runtime (§6).
#
# This is the ONLY build credential in the chart. Git tokens are per function -
# supplied by the caller and stored by the API as `{workload}-git` - so they are
# never platform-wide and never come from ESO.
#
# Materialised in BOTH namespaces, because the credential's two roles now live
# on opposite sides of the platform/tenant split (§2):
#   - API namespace       PUSH, by the build; also the build pod's own pull
#                         secret for the stack, store and builder images.
#   - workloads namespace PULL, by the function's KSVC at runtime.
# A Secret cannot be referenced across namespaces, so each namespace gets its
# own ExternalSecret resolving the same ClusterSecretStore key - one source of
# truth, two projections, and both rotate together.
{{- if $registry.create }}
{{- range $ns := (list .Values.namespaces.api .Values.namespaces.workloads) }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ $registry.name }}
  namespace: {{ $ns }}
  labels:
    {{- include "serverless-api.labels" $ | nindent 4 }}
spec:
  refreshInterval: {{ $.Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ $.Values.externalSecrets.clusterSecretStore }}
    kind: ClusterSecretStore
  target:
    name: {{ $registry.name }}
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |-
          {"auths":{"{{ $.Values.registry.url }}":{"username":"{{ `{{ .username }}` }}","password":"{{ `{{ .password }}` }}"}}}
  data:
    - secretKey: username
      remoteRef:
        key: {{ $registry.key }}
        property: {{ $registry.usernameProperty }}
    - secretKey: password
      remoteRef:
        key: {{ $registry.key }}
        property: {{ $registry.passwordProperty }}
{{- end }}
{{- end }}
{{- end }}
