{{- if .Values.build.enabled }}
{{- $registry := .Values.build.serviceAccount.registrySecret }}
# Rendered in both namespaces: the build pushes with it (API ns), the KSVC pulls
# with it (workloads ns), and Secrets do not cross namespaces. Same store key. (§6)
{{- if $registry.create }}
{{- range $ns := (list .Values.namespaces.api .Values.namespaces.workloads) }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ $registry.name }}
  namespace: {{ $ns }}
  labels:
    {{- include "serverless-api.labels" $ | nindent 4 }}
spec:
  refreshInterval: {{ $.Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ $.Values.externalSecrets.clusterSecretStore }}
    kind: ClusterSecretStore
  target:
    name: {{ $registry.name }}
    # Keyed by registry.url alone: docker auth is per HOST, not per org path.
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |-
          {"auths":{"{{ $.Values.registry.url }}":{"username":"{{ `{{ .username }}` }}","password":"{{ `{{ .password }}` }}"}}}
  data:
    - secretKey: username
      remoteRef:
        key: {{ $registry.key }}
        property: {{ $registry.usernameProperty }}
    - secretKey: password
      remoteRef:
        key: {{ $registry.key }}
        property: {{ $registry.passwordProperty }}
{{- end }}
{{- end }}
{{- end }}
