{{- if .Values.build.enabled }}
{{- $registry := .Values.build.serviceAccount.registrySecret }}
{{- $kpack := .Values.build.kpackRegistry }}
{{- $region := fromYaml (include "serverless-api.regionRegistry" .) }}
# This REGION's credential, for the ClusterBuilders' ServiceAccount beside it:
# composing a builder image pushes to this registry. The per-tenant copies -
# what function builds push with and their KSVCs pull with - come from the
# tenant template set. docs/BUILDING.md - Registry & Git Credentials.
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ $registry.name }}
  namespace: {{ $.Values.namespaces.api }}
  labels:
    {{- include "serverless-api.labels" $ | nindent 4 }}
spec:
  refreshInterval: {{ $.Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ $.Values.externalSecrets.clusterSecretStore }}
    kind: ClusterSecretStore
  target:
    name: {{ $registry.name }}
    # Keyed by this region's registry HOST alone: docker auth is per host, not per
    # org path, and a peer's registry is not this region's to authenticate to.
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |-
          {"auths":{"{{ $region.url }}":{"username":"{{ `{{ .username }}` }}","password":"{{ `{{ .password }}` }}"}}}
  data:
    - secretKey: username
      remoteRef:
        key: {{ tpl $registry.key $ }}
        property: {{ $registry.usernameProperty }}
    - secretKey: password
      remoteRef:
        key: {{ tpl $registry.key $ }}
        property: {{ $registry.passwordProperty }}
{{- if $kpack.url }}
---
# Pull-only, for the ClusterStack/ClusterStore content every region's builds read
# but none of them writes. One registry, one credential, identical everywhere.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ $kpack.pullSecret.name }}
  namespace: {{ $.Values.namespaces.api }}
  labels:
    {{- include "serverless-api.labels" $ | nindent 4 }}
spec:
  refreshInterval: {{ $.Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ $.Values.externalSecrets.clusterSecretStore }}
    kind: ClusterSecretStore
  target:
    name: {{ $kpack.pullSecret.name }}
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |-
          {"auths":{"{{ $kpack.url }}":{"username":"{{ `{{ .username }}` }}","password":"{{ `{{ .password }}` }}"}}}
  data:
    - secretKey: username
      remoteRef:
        key: {{ tpl $kpack.pullSecret.key $ }}
        property: {{ $kpack.pullSecret.usernameProperty }}
    - secretKey: password
      remoteRef:
        key: {{ tpl $kpack.pullSecret.key $ }}
        property: {{ $kpack.pullSecret.passwordProperty }}
{{- end }}
{{- end }}
