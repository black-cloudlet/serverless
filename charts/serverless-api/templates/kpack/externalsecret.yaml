{{- if .Values.build.enabled }}
{{- $registry := .Values.build.serviceAccount.registrySecret }}
{{- $git := .Values.build.serviceAccount.gitSecret }}
# Build credentials, sourced from the PRE-EXISTING ClusterSecretStore like every
# other platform secret (docs §7.1 / §12.5). Both are shaped for kpack:
#   - the registry credential is a dockerconfigjson, used to PUSH the built image
#     and, on the KSVC, to PULL it at runtime (§6)
#   - the git credential is basic-auth annotated `kpack.io/git`, which is how
#     kpack matches a credential to a source repository host
{{- if $registry.create }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ $registry.name }}
  namespace: {{ .Values.namespaces.workloads }}
  labels:
    {{- include "serverless-api.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.clusterSecretStore }}
    kind: ClusterSecretStore
  target:
    name: {{ $registry.name }}
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |-
          {"auths":{"{{ .Values.registry.url }}":{"username":"{{ `{{ .username }}` }}","password":"{{ `{{ .password }}` }}"}}}
  data:
    - secretKey: username
      remoteRef:
        key: {{ $registry.key }}
        property: {{ $registry.usernameProperty }}
    - secretKey: password
      remoteRef:
        key: {{ $registry.key }}
        property: {{ $registry.passwordProperty }}
{{- end }}
{{- if $git.create }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ $git.name }}
  namespace: {{ .Values.namespaces.workloads }}
  labels:
    {{- include "serverless-api.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.clusterSecretStore }}
    kind: ClusterSecretStore
  target:
    name: {{ $git.name }}
    template:
      type: kubernetes.io/basic-auth
      metadata:
        annotations:
          kpack.io/git: {{ $git.host | quote }}
      data:
        username: {{ `"{{ .username }}"` }}
        password: {{ `"{{ .password }}"` }}
  data:
    - secretKey: username
      remoteRef:
        key: {{ $git.key }}
        property: {{ $git.usernameProperty }}
    - secretKey: password
      remoteRef:
        key: {{ $git.key }}
        property: {{ $git.passwordProperty }}
{{- end }}
{{- end }}
