{{- if .Values.build.enabled }}
{{- $registry := .Values.build.serviceAccount.registrySecret }}
{{- $kpack := .Values.build.kpackRegistry }}
{{- $site := fromYaml (include "serverless-api.siteRegistry" .) }}
# This SITE's credential, three readers, all in the workloads namespace: kpack
# pushes the built image with it, the build pod pulls the builder image with it,
# and the function's KSVC pulls the built image with it.
# docs/PER-SITE-REGISTRY.md - Where the credentials come from.
{{- if $registry.create }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ $registry.name }}
  namespace: {{ $.Values.namespaces.workloads }}
  labels:
    {{- include "serverless-api.labels" $ | nindent 4 }}
spec:
  refreshInterval: {{ $.Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ $.Values.externalSecrets.clusterSecretStore }}
    kind: ClusterSecretStore
  target:
    name: {{ $registry.name }}
    # Keyed by this site's registry HOST alone: docker auth is per host, not per
    # org path, and a peer's registry is not this site's to authenticate to.
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |-
          {"auths":{"{{ $site.url }}":{"username":"{{ `{{ .username }}` }}","password":"{{ `{{ .password }}` }}"}}}
  data:
    - secretKey: username
      remoteRef:
        key: {{ tpl $registry.key $ }}
        property: {{ $registry.usernameProperty }}
    - secretKey: password
      remoteRef:
        key: {{ tpl $registry.key $ }}
        property: {{ $registry.passwordProperty }}
{{- end }}
{{- if and $kpack.url $kpack.pullSecret.create }}
---
# Pull-only, for the ClusterStack/ClusterStore content every site's builds read
# but none of them writes. One registry, one credential, identical everywhere.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ $kpack.pullSecret.name }}
  namespace: {{ $.Values.namespaces.workloads }}
  labels:
    {{- include "serverless-api.labels" $ | nindent 4 }}
spec:
  refreshInterval: {{ $.Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ $.Values.externalSecrets.clusterSecretStore }}
    kind: ClusterSecretStore
  target:
    name: {{ $kpack.pullSecret.name }}
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |-
          {"auths":{"{{ $kpack.url }}":{"username":"{{ `{{ .username }}` }}","password":"{{ `{{ .password }}` }}"}}}
  data:
    - secretKey: username
      remoteRef:
        key: {{ tpl $kpack.pullSecret.key $ }}
        property: {{ $kpack.pullSecret.usernameProperty }}
    - secretKey: password
      remoteRef:
        key: {{ tpl $kpack.pullSecret.key $ }}
        property: {{ $kpack.pullSecret.passwordProperty }}
{{- end }}
{{- end }}
