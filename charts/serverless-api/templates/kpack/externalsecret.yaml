{{- if .Values.build.enabled }}
{{- $registry := .Values.build.serviceAccount.registrySecret }}
# One credential, three readers, all in the workloads namespace: kpack pushes the
# built image with it, the build pod pulls the builder image with it, and the
# function's KSVC pulls the built image with it.
# docs/BUILDING.md - Registry & Git Credentials.
{{- if $registry.create }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ $registry.name }}
  namespace: {{ $.Values.namespaces.workloads }}
  labels:
    {{- include "serverless-api.labels" $ | nindent 4 }}
spec:
  refreshInterval: {{ $.Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ $.Values.externalSecrets.clusterSecretStore }}
    kind: ClusterSecretStore
  target:
    name: {{ $registry.name }}
    # Keyed by registry.url alone: docker auth is per HOST, not per org path.
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |-
          {"auths":{"{{ $.Values.registry.url }}":{"username":"{{ `{{ .username }}` }}","password":"{{ `{{ .password }}` }}"}}}
  data:
    - secretKey: username
      remoteRef:
        key: {{ $registry.key }}
        property: {{ $registry.usernameProperty }}
    - secretKey: password
      remoteRef:
        key: {{ $registry.key }}
        property: {{ $registry.passwordProperty }}
{{- end }}
{{- end }}
