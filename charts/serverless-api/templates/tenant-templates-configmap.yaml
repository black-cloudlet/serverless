{{- $ns := include "serverless-api.tenantNamespaceToken" . }}
{{- $group := include "serverless-api.tenantGroupToken" . }}
# The resource set every tenant namespace is converged to. Argo syncs this
# ConfigMap; the provisioner mounts it whole, hashes it, and applies it into each
# {group}{suffix} namespace with the two tokens substituted - which is how a
# `helm upgrade` reaches namespaces that were created at runtime and that Argo
# therefore cannot see (docs/proposals/namespace-per-group.md).
#
# NOTHING HERE MAY DEPEND ON THE REGION. Both regions render this chart with the
# same values, so both hold identical bytes and the same hash; the ensure call
# converges a peer's namespace from whichever provisioner took the request. A
# per-region value would make that write wrong rather than merely redundant.
#
# The policy bodies come from the same partials the legacy namespace renders
# from, so the two cannot drift.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "serverless-api.tenantTemplatesName" . }}
  namespace: {{ .Values.namespaces.api }}
  labels:
    {{- include "serverless-api.labels" . | nindent 4 }}
data:
  # The namespace itself. The provisioner adds its own managed-by and group
  # labels in code - the prune and the GC select on those, so they are not left
  # to a template to get right.
  10-namespace.yaml: |
    apiVersion: v1
    kind: Namespace
    metadata:
      name: {{ $ns }}
      labels:
        {{- include "serverless-api.namespaceLabels" (dict "root" $ "extra" (.Values.tenantNamespaces.labels | default dict)) | nindent 8 }}
  20-network-policies.yaml: |
    {{- include "serverless-api.workloadNetworkPolicies" (dict "root" $ "namespace" $ns) | nindent 4 }}
  30-ca-bundle.yaml: |
    {{- include "serverless-api.caBundleConfigMap" (dict "root" $ "namespace" $ns) | nindent 4 }}
  # The API's client-cert user, granted the same namespaced rules it holds in the
  # legacy namespace - the ClusterRole is the definition, this is the grant, and
  # it reaches only into this one namespace.
  40-rbac.yaml: |
    apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata:
      name: {{ .Values.name }}
      namespace: {{ $ns }}
    subjects:
      - kind: User
        name: {{ .Values.certificate.user }}
        apiGroup: rbac.authorization.k8s.io
    roleRef:
      kind: ClusterRole
      name: {{ .Values.name }}
      apiGroup: rbac.authorization.k8s.io
{{- if .Values.build.enabled }}
  # Builds run in the tenant's own namespace, because a kpack Image is an owned
  # resource of the function's KSVC and an ownerReference cannot cross one
  # (docs/BUILDING.md - Lifecycle & Cleanup). So everything a build needs has to
  # exist there too.
  50-build-serviceaccount.yaml: |
    apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: {{ .Values.build.serviceAccount.name }}
      namespace: {{ $ns }}
    {{- $creds := list .Values.build.serviceAccount.registrySecret.name }}
    {{- with .Values.build.kpackRegistry }}
    {{- if and .url .pullSecret.name }}
    {{- $creds = append $creds .pullSecret.name }}
    {{- end }}
    {{- end }}
    secrets:
      {{- range $creds }}
      - name: {{ . }}
      {{- end }}
    imagePullSecrets:
      {{- range $creds }}
      - name: {{ . }}
      {{- end }}
{{- if .Values.build.scc.enabled }}
  # The SCC grant, same ClusterRole as the legacy namespace's - the per-function
  # build accounts the API names at request time live here now.
  60-build-scc.yaml: |
    apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata:
      name: {{ .Values.name }}-use-{{ .Values.build.scc.name }}
      namespace: {{ $ns }}
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: {{ .Values.name }}-use-{{ .Values.build.scc.name }}
    subjects:
      - kind: Group
        apiGroup: rbac.authorization.k8s.io
        name: system:serviceaccounts:{{ $ns }}
{{- end }}
{{- if .Values.build.serviceAccount.registrySecret.create }}
  # This region's registry credential. Written as an ExternalSecret rather than a
  # Secret so the value never passes through the ConfigMap - ESO fills it in the
  # tenant namespace from Vault, exactly as it does for the legacy one.
  #
  # Two values here are per region - the Vault path and the registry host - and
  # a per-region value is exactly what this set may not carry: the two regions
  # would render different bytes and their hashes would diverge. Both go in as
  # provisioner tokens instead, resolved against the cluster being converged, so
  # the set stays identical while its output does not. A Vault path, never a
  # credential: ESO reads it in the tenant namespace.
  70-registry-credentials.yaml: |
    apiVersion: external-secrets.io/v1beta1
    kind: ExternalSecret
    metadata:
      name: {{ .Values.build.serviceAccount.registrySecret.name }}
      namespace: {{ $ns }}
    spec:
      refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
      secretStoreRef:
        name: {{ .Values.externalSecrets.clusterSecretStore }}
        kind: ClusterSecretStore
      target:
        name: {{ .Values.build.serviceAccount.registrySecret.name }}
        template:
          type: kubernetes.io/dockerconfigjson
          data:
            .dockerconfigjson: |-
              {{ printf `{"auths":{"%s":{"username":"{{ .username }}","password":"{{ .password }}"}}}` (include "serverless-api.tenantRegistryToken" .) }}
      data:
        - secretKey: username
          remoteRef:
            key: {{ include "serverless-api.tenantVaultKey" (dict "root" $ "key" .Values.build.serviceAccount.registrySecret.key) }}
            property: {{ .Values.build.serviceAccount.registrySecret.usernameProperty }}
        - secretKey: password
          remoteRef:
            key: {{ include "serverless-api.tenantVaultKey" (dict "root" $ "key" .Values.build.serviceAccount.registrySecret.key) }}
            property: {{ .Values.build.serviceAccount.registrySecret.passwordProperty }}
{{- end }}
{{- end }}
