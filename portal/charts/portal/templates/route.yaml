# External exposure for the portal UI. host defaults to portal.{global.baseDomain}
# and is the same host AUTH_URL is derived from (see the portal.publicUrl helper),
# so the OIDC redirect URIs line up.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "portal.labels" . | nindent 4 }}
    {{- with .Values.route.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.route.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  host: {{ .Values.route.host | default (printf "portal.%s" .Values.global.baseDomain) | quote }}
  to:
    kind: Service
    name: {{ .Values.name }}
  port:
    targetPort: {{ .Values.service.portName }}
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
