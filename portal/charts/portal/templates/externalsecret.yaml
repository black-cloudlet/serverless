# One ExternalSecret per kind of data (separate target Secrets), referencing the
# PRE-EXISTING ClusterSecretStore - we do NOT ship a SecretStore. Every listed
# Secret is also loaded into the portal via the Deployment's envFrom.
{{- range .Values.externalSecrets.secrets }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .name }}
  namespace: {{ $.Values.namespace }}
  labels:
    {{- include "portal.labels" $ | nindent 4 }}
spec:
  refreshInterval: {{ .refreshInterval | default $.Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ $.Values.externalSecrets.clusterSecretStore }}
    kind: ClusterSecretStore
  target:
    name: {{ .name }}
  data:
    {{- range .data }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ .key }}
        property: {{ .property }}
    {{- end }}
{{- end }}
