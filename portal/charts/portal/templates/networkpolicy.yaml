{{- if .Values.networkPolicy.enabled }}
# Default-deny for the portal namespace, then reopen only what the portal needs:
# ingress from the OpenShift router, egress to DNS and off-cluster (SSO + the
# platform API Routes). Internal pod/service CIDRs are excluded from off-cluster
# egress so the portal cannot reach other pods/Services directly.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "portal.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-system
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "portal.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- range .Values.networkPolicy.ingressNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-dns
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "portal.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.dnsNamespace }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# Egress: off-cluster (SSO + platform API Routes); internal CIDRs excluded.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-external
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "portal.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.externalEgress.cidr }}
            {{- with .Values.networkPolicy.externalEgress.exceptCIDRs }}
            except:
              {{- toYaml . | nindent 14 }}
            {{- end }}
{{- end }}
