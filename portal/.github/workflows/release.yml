name: Release

# One-click release (manual). Enter a version - X.Y.Z or a pre-release
# X.Y.Z-{alpha|beta|rc}.N - and this workflow:
#   1. bumps the version in package.json + Chart.yaml and commits it onto the
#      vX.Y.Z tag ONLY - the branch it runs from is left unchanged;
#   2. runs the full check suite;
#   3. builds/scans/signs and publishes the image and chart from the tag, then
#      cuts a GitHub Release. A pre-release does NOT move the :latest image tag.
#
# Self-contained: a tag pushed by GITHUB_TOKEN does not re-trigger a tag workflow,
# so the whole release runs here - no PAT. The stamped version lives only on the
# tag; the branch stays at its development baseline.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 1.2.0 or 1.2.0-beta.1 (no leading v)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # commit the version bump + push the tag
    outputs:
      version: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Validate, bump, commit, tag
        run: |
          VERSION="${{ inputs.version }}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
            echo "::error::version must be X.Y.Z or X.Y.Z-{alpha|beta|rc}.N (e.g. 1.2.0-beta.1), no leading v"; exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "::error::tag v$VERSION already exists"; exit 1
          fi
          npm version "$VERSION" --no-git-tag-version --allow-same-version >/dev/null
          sed -i -E "s/^version:.*/version: $VERSION/" charts/portal/Chart.yaml
          sed -i -E "s/^appVersion:.*/appVersion: \"$VERSION\"/" charts/portal/Chart.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "release: v$VERSION"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"

  # Same validation as CI; publishing is gated on it via `needs`.
  checks:
    needs: prepare
    uses: ./.github/workflows/checks.yml

  image:
    needs: [prepare, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: "v${{ needs.prepare.outputs.version }}" # build the tagged code
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}/portal
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=latest,enable=${{ !contains(needs.prepare.outputs.version, '-') }}

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/portal"
          cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"

  chart:
    needs: [prepare, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: "v${{ needs.prepare.outputs.version }}" # Chart.yaml already stamped by prepare
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Package
        run: helm package charts/portal --destination dist

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push + sign
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
          helm push dist/portal-*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts 2>&1 | tee push.log
          DIGEST=$(grep -oE 'sha256:[0-9a-f]+' push.log | head -1)
          cosign sign --yes "ghcr.io/${{ github.repository_owner }}/charts/portal@${DIGEST}"

  github-release:
    needs: [prepare, image, chart]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the GitHub Release
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          REPO_LC="${GITHUB_REPOSITORY,,}"
          cat > notes.md <<EOF
          ## Artifacts

          - **Image:** \`ghcr.io/${REPO_LC}/portal:${VERSION}\`
          - **Chart:** \`oci://ghcr.io/${{ github.repository_owner }}/charts/portal:${VERSION}\`

          Both are cosign-signed (keyless) and carry an SBOM.
          EOF
          prerelease=""
          [[ "$VERSION" == *-* ]] && prerelease="--prerelease"
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --notes-file notes.md \
            --generate-notes $prerelease
