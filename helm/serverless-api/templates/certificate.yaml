# cert-manager client certificate, ACME-issued, CN = DNS name. docs §6.3 / §12.3
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.clientCert.secretName }}
  namespace: {{ .Values.namespaces.api }}
  labels:
    {{- include "serverless-api.labels" . | nindent 4 }}
spec:
  secretName: {{ .Values.clientCert.secretName }}
  commonName: {{ include "serverless-api.clientCN" . }}
  dnsNames:
    - {{ include "serverless-api.clientCN" . }}
  usages:
    - client auth
  issuerRef:
    name: {{ .Values.clientCert.issuerRef.name }}
    kind: {{ .Values.clientCert.issuerRef.kind }}
