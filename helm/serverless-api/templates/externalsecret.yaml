# ExternalSecret ONLY — references the pre-existing ClusterSecretStore.
# We do NOT ship a SecretStore. docs §7.1 / §12.5
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: serverless-api-secrets
  namespace: {{ .Values.namespaces.api }}
  labels:
    {{- include "serverless-api.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.clusterSecretStore }}
    kind: ClusterSecretStore
  target:
    name: serverless-api-secrets
  data:
    - secretKey: sso-client-secret
      remoteRef:
        key: {{ .Values.externalSecrets.vaultPath }}
        property: sso_client_secret
