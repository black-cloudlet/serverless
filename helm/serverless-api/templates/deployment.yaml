apiVersion: apps/v1
kind: Deployment
metadata:
  name: serverless-api
  namespace: {{ .Values.namespaces.api }}
  labels:
    {{- include "serverless-api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "serverless-api.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "serverless-api.labels" . | nindent 8 }}
    spec:
      # Runs as the namespace 'default' ServiceAccount — cluster auth uses the
      # cert-manager client certificate, not the SA token (docs §6.3).
      containers:
        - name: serverless-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: serverless-api-config     # non-secret config (incl. SERVERLESS_SITES)
            - secretRef:
                name: serverless-api-secrets    # ESO-projected secrets
          volumeMounts:
            - name: client-cert
              mountPath: {{ .Values.clientCert.mountPath }}
              readOnly: true
            - name: trusted-ca
              mountPath: {{ .Values.caBundle.mountPath }}
              readOnly: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: client-cert
          secret:
            secretName: {{ .Values.clientCert.secretName }}
        - name: trusted-ca
          configMap:
            name: {{ .Values.caBundle.configMap }}
