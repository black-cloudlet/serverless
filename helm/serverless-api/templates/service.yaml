apiVersion: v1
kind: Service
metadata:
  name: serverless-api
  namespace: {{ .Values.namespaces.api }}
  labels:
    {{- include "serverless-api.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "serverless-api.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 80
      targetPort: 8080
