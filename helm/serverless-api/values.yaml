# Default values for serverless-api.
# Per-site overrides live in the central GitOps repo (values-site-a.yaml, ...).
global:
  clusterName: example
  baseDomain: example.com
  site: example
  env: example

image:
  repository: registry.internal/serverless/serverless-api
  tag: "0.1.0"
  pullPolicy: IfNotPresent

replicaCount: 2

# Namespaces created by this chart, guarded against ArgoCD delete/prune.
namespaces:
  api: serverless-api               # where the API runs
  workloads: serverless-workloads   # where the API creates functions/containers

# Single platform wildcard domain (docs §5).
routeDomain: serverless.example.com

# Browser origins allowed to call the API (e.g. the ServiceNow portal).
# Empty disables CORS (server-side callers don't need it).
corsAllowOrigins: []
#  - https://acme.service-now.com

# SSO OIDC (docs §6). clientSecret comes from Vault via ESO, not here.
sso:
  issuer: https://sso.internal/realms/serverless
  audience: serverless-api
  jwksUrl: https://sso.internal/realms/serverless/protocol/openid-connect/certs
  groupsClaim: groups
  adminGroups:
    - platform-admins

registry:
  url: registry.internal

# Site connection profiles the API talks to (active/active, both clusters).
# Only endpoint + namespace per site; the client cert and CA are global.
sites:
  - name: central                 # site/region
    cluster: central-0            # cluster instance
  - name: south
    cluster: south-0

# cert-manager client certificate (CN = DNS name, ACME-issued). docs §6.3
# Same identity is valid in every cluster; mounted at mountPath as tls.crt/tls.key.
certificate:
  name: serverless-client-cert
  user: serverless-api.client.example.com
  mountPath: /etc/serverless/client
  issuerRef:
    name: client-cert-acme
    kind: ClusterIssuer

# OpenShift-injected trusted CA bundle (same for every cluster). Created in both
# namespaces and mounted into the API and every workload.
caBundle:
  name: ca-bundle
  key: ca-bundle.crt
  mountPath: /etc/ssl/certs

# ESO: reference the PRE-EXISTING ClusterSecretStore; we ship ExternalSecret(s) only.
# Each kind of data is its own Secret (separate rotation/exposure). Every listed
# Secret is projected from Vault and loaded into the API via envFrom — so each
# `secretKey` must be a valid environment variable name. Add an entry to create a
# Secret; remove it to skip.
externalSecrets:
  clusterSecretStore: vault-backend
  refreshInterval: 1h
  secrets:
    - name: serverless-api-sso
      data:
        - secretKey: SSO_CLIENT_SECRET
          key: cloudlet/platforms/serverless-api
          property: sso-client-secret
        - secretKey: SSO_CLIENT_ID
          key: cloudlet/platforms/serverless-api
          property: sso-client-secret
    - name: serverless-api-keys
      data:
        - secretKey: SERVERLESS_ADMIN_API_KEY
          key: cloudlet/platforms/serverless-api
          property: admin-api-key

service:
  portName: http
  targetPort: 8080
  port: 80

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi
